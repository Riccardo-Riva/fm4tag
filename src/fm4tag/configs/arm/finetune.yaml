# @package _global_
# FT: start from a pretraining checkpoint, train everything.  The loaded parts
# (encoders; the aggregator only if that pretraining trained it) train at
# optimizer.backbone_lr, held at 0 for the first unfreeze_at_epoch epochs.
#
# Every arm sets the same keys.
phase: finetune

encoder_ckpt:         null   # pretraining checkpoint — must be given
require_encoder_ckpt: true   # the runner refuses to start without it
load_aggregator:      auto   # auto = only if that pretraining trained it (jet_contrastive > 0); true | false

finetune:
  freeze_encoders:   false
  unfreeze_at_epoch: 2

optimizer:
  backbone_lr: ${optimizer.lr}   # S3 also tries lr / 10
