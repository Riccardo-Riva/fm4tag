# @package _global_
# Pretraining (P0 / P1): what pretrains is the base config's `pretrain` block —
# P0 = contrastive loss on the per-object embeddings only (its loss weights);
# P1 adds the jet-level contrastive on the aggregator output:
#   pretrain.loss_weights.jet_contrastive=1.0
#
# Every arm sets the same keys; the fine-tuning ones are not read here.
phase: pretrain

encoder_ckpt:         null
require_encoder_ckpt: false
load_aggregator:      auto

finetune:
  freeze_encoders:   false   # not read in pretraining
  unfreeze_at_epoch: 0       # not read in pretraining

trainer:
  # S2 (no clipping): every pretraining spiked after the lr peak; P2 then sat
  # on a plateau (T 0.1) or collapsed completely (T 0.3).  Pretraining only:
  # the downstream cells add it with +trainer.gradient_clip_val.
  gradient_clip_val: 1.0
