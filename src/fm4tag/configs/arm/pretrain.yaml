# @package _global_
# Pretraining (P0): contrastive loss on the feature embeddings only — the
# per-object embeddings of the tracks and of the global jet features.  P1 adds
# the jet-level contrastive on the aggregator output:
#   pretrain.loss_weights.jet_contrastive=1.0
phase: pretrain

pretrain:
  loss_weights:
    contrastive:     1.0
    denoising_cat:   0.0
    denoising_con:   0.0
    jet_contrastive: 0.0
  warmup_frac: 0.02
  # P0 recipe from S2 (rriva, 2026-10-21): T 0.1 with lambda 0.4 (campaign_ssl.yaml);
  # best frozen-encoder probe, 0.635 vs 0.656 for frozen random encoders.
  contrastive_loss:
    temperature: 0.1

trainer:
  max_epochs: 30
  # S2 (no clipping): every run spiked after the lr peak; P2 then sat on a
  # plateau (T 0.1) or collapsed completely (T 0.3).
  gradient_clip_val: 1.0
