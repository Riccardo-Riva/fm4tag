# ════════════════════════════════════════════════════════════════════════════
# Encoder architecture — RowCol (alternating col-then-row attention).
#
# Selected via the parent config's defaults list, e.g.
#   defaults: [{encoders: rowcol_v0}, _self_]
# or overridden on the CLI:  encoders=rowcol_v0
#
# Every `layers` entry lists ONLY the kwargs its block class accepts:
#   type: rowcol → RowColTransformer(col_heads, row_heads, dim_head,
#                                    dim_row_head, num_inds, ...)
# `dim` and (for row-aware blocks) `nfeats` are injected at runtime.
# ════════════════════════════════════════════════════════════════════════════

global_encoder:
  _target_: fm4tag.models.GlobalTransformerEncoder
  dim:          16     # token width — the backbone runs at this width
  proj_hidden:  null   # null → auto (2 × dim × n_tokens)
  proj_out:     32    # projector output width — head only, never the backbone
  # num_features injected at runtime from variables.jets.inputs
  layers:
    - type:         rowcol
      depth:        6
      col_heads:    2
      row_heads:    2
      dim_head:     8
      dim_row_head: 8
      ff_mult:      2
      attn_dropout: 0.0
      ff_dropout:   0.0
      num_inds:     128      # null = all-pairs row attention over the batch
      row_mode:     per_token  # per_token = one ISAB per feature token (see
                               # rowcol_concat_v0 for the concat alternative)

constituents:
  tracks:
    _target_: fm4tag.models.Encoder
    dim:              16
    cont_embeddings:  MLP    # MLP | pos_singleMLP
    proj_hidden:      null   # null → auto (3/4 × dim × n_tokens)
    proj_out:         128    # null → auto (1/2 × dim × n_tokens)
    # categories and num_continuous are injected at runtime from variables.tracks
    layers:
      - type:          rowcol
        depth:         6
        col_heads:     2
        row_heads:     2
        dim_head:      8
        dim_row_head:  8
        ff_mult:       2
        attn_dropout:  0.0
        ff_dropout:    0.0
        num_inds:      128      # ISAB inducing points: row attention costs
                              # O(B*num_inds) per token instead of O(B^2), and
                              # runs N=19 independent per-token attentions.
                              # At dim=128 this was a throughput cliff (16->128
                              # measured 3.47->1.20 it/s).  At the current dim=16
                              # it is not: 128 vs 16 measured 4.18 vs 4.20 it/s
                              # (1 A40, finetune, bs 1024) — the row attention is
                              # no longer what the step is spending its time on.
                              # null = all-pairs row attention over the batch.
        row_mode:      per_token  # per_token = one ISAB per feature token, at
                              # width dim.  concat runs a single ISAB over the
                              # (N*dim) vector and is FASTER — flipping only this
                              # key measured 4.24 -> 4.72 it/s (236 -> 212 ms/step)
                              # on 1 A40, finetune, bs 1024, for 2.48M -> 6.09M
                              # params.  It is a different model though (the row
                              # step then mixes feature tokens), so this is not a
                              # free speedup — see rowcol_concat_v0.
