# ════════════════════════════════════════════════════════════════════════════
# fm4tag — SSL campaign: does contrastive pretraining of the SAINT-like
# encoders help the tagger?
#
# default.yaml + the settings every run of the campaign shares.  The arm (what
# is trained, starting from what) is the `arm` config group:
#
#   fm4tag --config-name=campaign_ssl arm=pretrain                     # P0
#   fm4tag --config-name=campaign_ssl arm=pretrain \
#          pretrain.loss_weights.jet_contrastive=1.0                   # P1
#   fm4tag --config-name=campaign_ssl arm=scratch                      # SC
#   fm4tag --config-name=campaign_ssl arm=finetune encoder_ckpt=<ckpt> # FT
#   fm4tag --config-name=campaign_ssl arm=frozen   encoder_ckpt=<ckpt> # FR
#
# The downstream jet-level contrastive term (JC) is
# finetune.loss_weights.jet_contrastive (0 = off).  Every value a run used is
# in its .hydra/config.yaml, which is what the analysis scripts read.
# ════════════════════════════════════════════════════════════════════════════

defaults:
  - default
  - _self_
  - arm: scratch
  - override /encoders: rowcol_concat_v0   # S1: same quality, ~1.45x faster

experiment_name: ssl_campaign

# Disjoint splits by eventNumber % 100: pretrain 0-63 (39.7M jets), train
# 64-93 (18.6M), val 94-96, test 97-99 (1.86M each).  Never mix with 112022.
base_path: /storage3/DSIP/rriva/datasets/transforming-jet-flavor/data_parallel_preprocess_251112_152051

chunk_size: 512        # intersample context (jets) — S1: 128 and 512 give the
                       # same tagger; 512 gives pretraining 4x more negatives
row_qk_norm: true      # every arm (rriva, 2026-10-22): without it contrastive
                       # pretraining grew the track row-attention logits to
                       # 1e5-1e7 (one-hot attention) and the 30-epoch runs blew up

datamodule:
  batch_size:  24576   # per arm: the largest multiple of 8*chunk_size under
                       # ~38 GiB (S0); this one fits SC/FT. An optimisation knob only
  num_workers: 10

trainer:
  devices:    1
  max_epochs: 40       # S1: the best epoch comes at 7-10, so the cosine has to
                       # decay within reach of it (was 100: lr ~98% at the best)

optimizer:
  lr: 3.0e-4           # tuned per arm (S3)

# Augmentation strength of the views (CutMix + Mixup noise level): the λ-scan
# prior for the downstream JC; the pretraining grid (S2) overrides it.
lambda: 0.4

finetune:
  loss_weights:
    cross_entropy:   1.0
    jet_contrastive: 0.0   # JC arms: 0.3 (λ-scan prior)
  warmup_frac: 0.02

callbacks:
  # CPU RSS and GPU allocated / reserved / peak memory in metrics.csv — the
  # VRAM the batch size is sized against (and what the cluster admins audit).
  memory_monitor:
    _target_: fm4tag.callbacks.MemoryMonitorCallback
    log_every_n_steps: 500
  # Gradient norm before clipping (current, max since the last log, fraction
  # of steps clipped): S2 showed loss spikes at the lr peak.
  grad_norm_monitor:
    _target_: fm4tag.callbacks.GradNormMonitorCallback
  # Largest logit and entropy of each row-attention layer, on the first val
  # batch: the logit growth behind the pretraining blowups (2026-10-22).
  row_attn_monitor:
    _target_: fm4tag.callbacks.RowAttentionMonitor
