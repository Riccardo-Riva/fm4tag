# ════════════════════════════════════════════════════════════════════════════
# Encoder architecture — RowCol with SAINT-style CONCATENATED row attention.
#
# Same as rowcol_v0, except the row (intersample) step runs `row_mode: concat`:
# instead of one row attention per feature token (per_token), the N tokens are
# flattened to a single wide row vector (N*dim) and ONE all-pairs attention runs
# over the batch on that vector — SAINT's intersample attention.  concat's row
# step mixes the feature tokens (per_token's does not), so it is a different
# model, not a faster way to compute the same one.
#
# The trade: the row attention AND its feed-forward run at width
# row_dim = N*dim (304 for tracks, N=19), so their parameters scale as
# row_dim^2 — QUADRATIC in dim.  Doubling `dim` roughly quadruples the tracks
# encoder; ff_mult multiplies the largest term (the row feed-forward), so it is
# the cheapest lever.  Check `scripts/model_summary.py` before raising `dim`.
#
# Select with:  encoder=rowcol_concat_v0
# ════════════════════════════════════════════════════════════════════════════

global_encoder:
  _target_: fm4tag.models.GlobalTransformerEncoder
  dim:          16     # token width — the backbone runs at this width.
                       # Row-half params go as (N*dim)^2; see the header.
  proj_hidden:  null   # null → auto (2 × dim × n_tokens)
  proj_out:     128    # projector output width — head only, never the backbone
  # num_features injected at runtime from variables.jets.inputs
  layers:
    - type:         rowcol
      depth:        6
      col_heads:    1
      row_heads:    1
      dim_head:     16
      dim_row_head: 32     # attention inner dim = row_heads*dim_row_head, over
                           # the wide concatenated vector (row_dim = N*dim)
      ff_mult:      2
      attn_dropout: 0.0
      ff_dropout:   0.0
      row_mode:     concat
      row_qk_norm:  ${oc.select:row_qk_norm,false}  # top-level switch

constituents:
  tracks:
    _target_: fm4tag.models.Encoder
    dim:              16     # row-half params go as (N*dim)^2 with N=19; see
                             # the header before raising this
    cont_embeddings:  MLP    # MLP | pos_singleMLP
    proj_hidden:      null   # null → auto (3/4 × dim × n_tokens)
    proj_out:         128    # null → auto (1/2 × dim × n_tokens)
    # categories and num_continuous are injected at runtime from variables.tracks
    layers:
      - type:          rowcol
        depth:         6
        col_heads:     1
        row_heads:     8
        dim_head:      16
        dim_row_head:  32     # inner dim over the concat vector (row_dim = N*dim).
                              # Attention inner = row_heads*dim_row_head = 8*32 =
                              # 256, just under row_dim = 19*16 = 304, so the
                              # projections narrow the residual stream rather than
                              # expand it.  Watch that ratio when changing dim:
                              # keeping dim_row_head=64 here would have made the
                              # inner dim 512, i.e. wider than the stream it reads,
                              # and the row attention would outweigh the row
                              # feed-forward (the reverse of the dim=64 regime).
        ff_mult:       2
        attn_dropout:  0.0
        ff_dropout:    0.0
        row_mode:      concat
        row_qk_norm:   ${oc.select:row_qk_norm,false}  # top-level switch
