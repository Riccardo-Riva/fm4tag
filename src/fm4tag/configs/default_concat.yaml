# ════════════════════════════════════════════════════════════════════════════
# fm4tag — experiment config using CONCATENATED-vector row attention.
#
# Identical to default.yaml in every respect except the encoder architecture:
# this config selects `encoders: rowcol_concat_v0`, whose row (intersample) step
# runs `row_mode: concat` — the N feature tokens are flattened to one wide
# (N*dim) vector and a single ISAB summarises the batch over it, instead of N
# independent per-token ISABs.
#
# Why: under the per-token factorisation `num_inds` is paid N times (N=19 for
# tracks) across N narrow matmuls, so raising it is expensive — 16->128 measured
# 3.47->1.20 it/s.  In concat mode it is paid once, in one wide matmul, so
# rowcol_concat_v0 can afford num_inds=64.  The trade is parameters: the row
# attention and its feed-forward scale with row_dim = N*dim rather than dim
# (2.2M -> 4.5M total for this architecture).
#
# This file INHERITS default.yaml and overrides only the encoders group, so any
# later edit to default.yaml (data paths, trainer, optimiser, losses, ...)
# applies here automatically — do not duplicate settings into this file.
#
# Use it in place of default.yaml:
#   fm4tag --config-name=default_concat ...
#   # or in slurm/*.sh:  CONFIG=default_concat.yaml
#
# Per-key CLI overrides work exactly as with default.yaml, e.g.
#   fm4tag --config-name=default_concat \
#          encoders.constituents.tracks.layers.0.num_inds=128
# ════════════════════════════════════════════════════════════════════════════

defaults:
  - default
  - override /encoders: rowcol_concat_v0
  - _self_
