# ROC comparison config for scripts/roc_comparison.py
#
# Single-model fraction scan: the D_b discriminant
#     D_b = log( p_b / (f_c * p_c + f_tau * p_tau + f_u * p_u) )
# depends on the background weights f_c / f_tau (f_u = 1 - f_c - f_tau) — this
# config plots the SAME model's ROC/discriminant at several (f_c, f_tau)
# settings, to see how the working point shifts as the fractions move.
#
# Model: run_20260804_165415, rowcol, ddp2, bs 1024, lr 3e-4, CE-only loss —
# the run with the lowest val/head/loss_ce (0.59976 @ epoch 9) across every
# classify_from_scratch run compared so far (the run_20260811_105149 lambda
# scan, its run_20260807_162950 jc=0 reference, and all eight
# run_20260804_165415 runs).
#
# All entries below point at the SAME checkpoint — roc_comparison.py now
# reuses the in-memory predictions across entries sharing a checkpoint, so
# inference runs once regardless of how many fraction settings are listed.
# The first entry's label matches the one already cached from the
# run_20260804_165415 vs. GN2 comparison, so it loads from disk instead of
# recomputing.
#
#     python scripts/roc_comparison.py --config scripts/configs/roc_comparison_fraction_scan_best_ce.yaml

models:
  # ── Baseline first: label matches predictions already cached (as
  # probs_f_c_0_2_f_tau_0_01.npz, copied from the run_20260804_165415 vs GN2
  # comparison's probs_lr_3e_4_no_jc.npz), so it loads from disk instead of
  # recomputing; every other entry below shares this checkpoint and reuses
  # these in-memory predictions (see probs_by_ckpt in roc_comparison.py).
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.2, f_tau = 0.01'  # baseline / ATLAS default
    fractions: {c: 0.2, tau: 0.01}
    colour: '#000000'

  # ── f_c scan, f_tau = 0.01 fixed ───────────────────────────────────────────
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.05, f_tau = 0.01'
    colour: '#1f3ecc'
    fractions: {c: 0.05, tau: 0.01}
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.1, f_tau = 0.01'
    colour: '#3d34be'
    fractions: {c: 0.1, tau: 0.01}
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.15, f_tau = 0.01'
    colour: '#5c29b0'
    fractions: {c: 0.15, tau: 0.01}
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.3, f_tau = 0.01'
    colour: '#951f76'
    fractions: {c: 0.3, tau: 0.01}
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.4, f_tau = 0.01'
    colour: '#b11f4a'
    fractions: {c: 0.4, tau: 0.01}
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.5, f_tau = 0.01'
    colour: '#cc1f1f'
    fractions: {c: 0.5, tau: 0.01}

  # ── f_tau scan, f_c = 0.2 fixed ────────────────────────────────────────────
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.2, f_tau = 0.005'
    colour: '#66ccee'
    fractions: {c: 0.2, tau: 0.005}
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.2, f_tau = 0.02'
    colour: '#228833'
    fractions: {c: 0.2, tau: 0.02}
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'f_c = 0.2, f_tau = 0.05'
    colour: '#004400'
    fractions: {c: 0.2, tau: 0.05}

reference_taggers:
  - label: 'GN2 only-JT (f_c = 0.2, f_tau = 0.01)'
    file: /storage3/DSIP/rriva/packages/salt-pt/salt/logs/GN2_only_jt_20260817-T134649/ckpts/epoch=015-val_loss=0.59814__test_pp_output_test.h5
    probs: {b: GN2_only_jt_pb, c: GN2_only_jt_pc, u: GN2_only_jt_pu, tau: GN2_only_jt_ptau}
    colour: '#EE6677'

# Label of the tagger used as the ratio-panel reference.
reference: 'GN2 only-JT (f_c = 0.2, f_tau = 0.01)'

# ── Jets / discriminant ───────────────────────────────────────────────────────
test_file: null  # null → test_dataset_path from the run's config

cuts:  # applied to all taggers (pt in MeV)
  - [pt, '>', 20000]
  - [pt, '<', 250000]
  - [eta, '>', -2.5]
  - [eta, '<', 2.5]

signal: b
backgrounds: [u, c, tau]
fractions: {c: 0.2, tau: 0.01}  # fallback default (every entry above overrides it)

sig_eff: {min: 0.6, max: 1.0, num: 100}
working_points: [0.70, 0.77, 0.85]

# Background rejection / signal efficiency vs pT at a fixed working point.
eff_vs_pt:
  working_point: 0.77
  bins_gev: [20, 30, 40, 60, 85, 110, 140, 175, 250]
  flat_per_bin: false

# ── Inference / plotting ──────────────────────────────────────────────────────
inference:
  batch_size: 1024
  num_workers: 8

plot:
  out_dir: plots/roc_fraction_scan_best_ce_model
  atlas_brand: ''
  atlas_first_tag: 'Simulation Internal'
  atlas_second_tag: "$\\sqrt{s} = 13$ TeV, $t\\bar{t}$\n$20 < p_T < 250$ GeV, $|\\eta| < 2.5$"
  figsize: [7, 7]
  y_scale: 1.3
  dpi: 200
  disc_plot: {bins: 50, range: [-10, 20], logy: false}
