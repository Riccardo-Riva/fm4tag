# ROC comparison config for scripts/roc_comparison.py
#
# Best classify-from-scratch fm4tag model found so far (run_20260804_165415,
# rowcol encoder, ddp2, bs 1024, lr 3e-4, CE-only loss — val_loss 0.5998 at
# epoch 9, the lowest across all classify_from_scratch sweeps) against the
# two 20260807 salt GN2 baselines, both trained on the same
# data_parallel_preprocess_251112_112022 dataset and evaluated here on
# fm4tag's own test split (test_file below) rather than salt's stale
# CI default (pp_output_test_zprime.h5), so all three taggers see the same
# jets.
#
#     python scripts/roc_comparison.py --config scripts/configs/roc_comparison_run_20260804_165415.yaml

models:
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'fm4tag rowcol (lr 3e-4, CE only)'
    colour: '#4477AA'

reference_taggers:
  - label: GN2
    file: /storage3/DSIP/rriva/packages/salt-pt/salt/logs/GN2_20260807-T112247/ckpts/epoch=015-val_loss=0.59084__test_pp_output_test.h5
    probs: {b: GN2_pb, c: GN2_pc, u: GN2_pu, tau: GN2_ptau}
    colour: '#EE6677'
  - label: GN2 only-JT
    file: /storage3/DSIP/rriva/packages/salt-pt/salt/logs/GN2_only_jt_20260807-T112341/ckpts/epoch=009-val_loss=0.59837__test_pp_output_test.h5
    probs: {b: GN2_only_jt_pb, c: GN2_only_jt_pc, u: GN2_only_jt_pu, tau: GN2_only_jt_ptau}
    colour: '#228833'

# Label of the tagger used as the ratio-panel reference.
reference: 'GN2'

# ── Jets / discriminant ───────────────────────────────────────────────────────
test_file: null  # null → test_dataset_path from the fm4tag run's config

cuts:  # applied to all taggers (pt in MeV)
  - [pt, '>', 20000]
  - [pt, '<', 250000]
  - [eta, '>', -2.5]
  - [eta, '<', 2.5]

signal: b
backgrounds: [u, c, tau]
fractions: {c: 0.2, tau: 0.01}  # f_c / f_tau of the D_b denominator (f_u = remainder)

sig_eff: {min: 0.6, max: 1.0, num: 100}
working_points: [0.70, 0.77, 0.85]

# Background rejection / signal efficiency vs pT at a fixed working point.
eff_vs_pt:
  working_point: 0.77
  bins_gev: [20, 30, 40, 60, 85, 110, 140, 175, 250]
  flat_per_bin: false

# ── Inference / plotting ──────────────────────────────────────────────────────
inference:
  batch_size: 1024
  num_workers: 8

plot:
  out_dir: plots/roc_run_20260804_165415_vs_salt_gn2
  atlas_brand: ''
  atlas_first_tag: 'Simulation Internal'
  atlas_second_tag: "$\\sqrt{s} = 13$ TeV, $t\\bar{t}$\n$20 < p_T < 250$ GeV, $|\\eta| < 2.5$"
  figsize: [7, 7]
  y_scale: 1.3
  dpi: 200
  disc_plot: {bins: 50, range: [-10, 20], logy: false}
