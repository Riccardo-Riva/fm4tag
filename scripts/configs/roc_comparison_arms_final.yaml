# Test-set ROC of the best seed of each no-JC downstream arm of the SSL campaign (F_final, F_p1_nojc) against
# GN2v01: trained from scratch (SC), fine-tuned from P0 (FT), frozen P0 encoders (FR), fine-tuned from P1, frozen
# P1 encoders.  Same runs and checkpoints as
# fraction_constrained_arms_final.yaml.
#
# This file draws every tagger at the nominal fractions (f_c 0.2, f_tau 0.01).  slurm/arm_roc/arm_roc_job.sh
# also writes roc_comparison_arms_final_optimal.yaml next to its outputs: this file with each model's fractions
# set to its own constrained optimum from the VALIDATION search, the label from `optimal_label`, and
# `plot.out_dir` from `optimal_out_dir` (roc_comparison.py ignores both keys).
#
#   python scripts/roc_comparison.py --config scripts/configs/roc_comparison_arms_final.yaml --device cuda

models:
- dir: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_final_20261028_235642/sc/seed_4242
  label: 'From scratch'
  checkpoint: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_final_20261028_235642/sc/seed_4242/sc/version_0/checkpoints/epoch009-step6480-val_loss_ce0.6217.ckpt
  colour: '#2a78d6'
- dir: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_final_20261028_235640/ft_p0s424/seed_4242
  label: 'Fine-tuned (P0)'
  checkpoint: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_final_20261028_235640/ft_p0s424/seed_4242/ft_p0s424/version_0/checkpoints/epoch005-step3888-val_loss_ce0.6303.ckpt
  colour: '#eb6834'
- dir: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_final_20261028_235640/fr_p0s424/seed_4242
  label: 'Frozen encoders (P0)'
  checkpoint: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_final_20261028_235640/fr_p0s424/seed_4242/fr_p0s424/version_0/checkpoints/epoch006-step1379-val_loss_ce0.6488.ckpt
  colour: '#1baf7a'
- dir: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_p1_nojc_20261109_175801/ft_p1s424/seed_4242
  label: 'Fine-tuned (P1)'
  checkpoint: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_p1_nojc_20261109_175801/ft_p1s424/seed_4242/ft_p1s424/version_0/checkpoints/epoch039-step25920-val_loss_ce0.6156.ckpt
  colour: '#9c2f0a'
- dir: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_p1_nojc_20261109_175801/fr_p1s42/seed_4242
  label: 'Frozen encoders (P1)'
  checkpoint: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_p1_nojc_20261109_175801/fr_p1s42/seed_4242/fr_p1s42/version_0/checkpoints/epoch020-step4137-val_loss_ce0.6335.ckpt
  colour: '#0b6b49'

# GN2v01 scores stored in the test file itself (no `file:` = read from test_file).
reference_taggers:
- label: 'GN2v01'
  probs: {b: GN2v01_pb, c: GN2v01_pc, u: GN2v01_pu, tau: GN2v01_ptau}
  fractions: {c: 0.2, tau: 0.01}
  colour: '#000000'

# Label of the tagger used as the ratio-panel reference.
reference: 'GN2v01'

# The fraction-optimised variant (written by slurm/arm_roc/arm_roc_job.sh).  {label} = the model's label above,
# {f_c} / {f_tau} = its optimum from fraction_constrained_arms_final.yaml.
optimal_label: '{label} ($f_c$ = {f_c:.3f}, $f_\tau$ = {f_tau:.3f})'
optimal_reference_label: 'GN2v01 ($f_c$ = 0.2, $f_\tau$ = 0.01)'
optimal_out_dir: /storage3/DSIP/rriva/research/fm4tag/plots/arm_comparison/roc_test_optimal

# ── Jets / discriminant ───────────────────────────────────────────────────────
test_file: /storage3/DSIP/rriva/datasets/transforming-jet-flavor/data_parallel_preprocess_251112_152051/test/output/pp_output_test.h5

cuts:  # applied to all taggers (pt in MeV)
- [pt, '>', 20000]
- [pt, '<', 250000]
- [eta, '>', -2.5]
- [eta, '<', 2.5]

signal: b
backgrounds: [u, c, tau]
fractions: {c: 0.2, tau: 0.01}  # every tagger in this file

sig_eff: {min: 0.6, max: 1.0, num: 100}
working_points: [0.70, 0.77, 0.80, 0.85]

# Background rejection / signal efficiency vs pT at a fixed working point.
eff_vs_pt:
  working_point: 0.80
  bins_gev: [20, 30, 40, 60, 85, 110, 140, 175, 250]
  flat_per_bin: false

# ── Inference / plotting ──────────────────────────────────────────────────────
# bf16 autocast as in training; batch a multiple of chunk_size 512 (see fraction_constrained_arms_final.yaml).
inference:
  batch_size: 28672
  num_workers: 8
  precision: bf16

plot:
  out_dir: /storage3/DSIP/rriva/research/fm4tag/plots/arm_comparison/roc_test_nominal
  title: ''
  atlas_brand: ''
  atlas_first_tag: 'Simulation Internal'
  atlas_second_tag: "$\\sqrt{s} = 13.6$ TeV, $t\\bar{t}$\n$20 < p_T < 250$ GeV, $|\\eta| < 2.5$"
  figsize: [7, 7]
  y_scale: 1.3
  dpi: 200
  disc_plot: {bins: 50, range: [-10, 20], logy: false}
