  r0922_0945: ${paths.root}/run_20260922_094553
  r0922_0951: ${paths.root}/run_20260922_095140

color:
  categorical: true           # per-entry `color:` below wins; this only matters as a fallback
  baseline_color: black

plot:
  out_dir: plots/val_loss_ce/xlim80
  filename: val_loss_ce_seed_curves.png
  title: 'Cross-Entropy, noise parameter $\lambda$ scan with $\alpha_{{Agg}} = 0.3$'
  ylabel: Validation Cross-Entropy Loss
  legend_title: 'augmentation strength $\lambda$'
  legend_outside: true
  figsize: [9.0, 5.6]
  show_n: true
  star_size: 9        # curves plot: per-seed star
  marker_size: 6      # markers plot: per-seed borderless square
  curve_alpha: 0.6
  ylim: [0.598, 0.620]
  xlim: [0, 80]

