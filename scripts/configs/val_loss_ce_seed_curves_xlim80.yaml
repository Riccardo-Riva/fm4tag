# Per-seed val CE plots for scripts/plot_seed_curves.py.
#
#   python scripts/plot_seed_curves.py --config scripts/configs/val_loss_ce_seed_curves_xlim80.yaml
#
# Writes two files under plot.out_dir:
#   val_loss_ce_seed_curves.png          — one thin curve per seed, small star
#                                          on each seed's best value
#   val_loss_ce_seed_curves_markers.png  — no curves; a borderless square at
#                                          each seed's best value
#
# DEFINITIVE pool, regenerated after every fm4tag run finished (2026-09-30).
# Every entry lists its seed directories explicitly: a bare `cell:` would also
# pick up a seed dir that has no run_info.yaml yet (unfinished), so only seeds
# with `status: completed` are named here.
#
# n completed seeds per lambda — jc0: 8, 0.05: 6, 0.1: 5, 0.2: 3, 0.25: 4, 0.3: 5, 0.35: 5, 0.4: 4, 0.45: 2, 0.5: 5, 0.55: 2, 0.6: 3, 0.64: 1, 0.65: 2, 0.7: 2, 0.75: 1, 0.8: 2
#
# Colour: one explicit hue per lambda (per-entry `color:`), so a lambda keeps its
# colour when lambdas are added.  The first 12 are Sasha Trubetskoy's "20 simple,
# distinct colors" (saturated subset, https://sashamaps.net/docs/resources/20-colors/);
# lambda 0.64 / 0.7 / 0.75 / 0.8 use four more picked by farthest-point search in
# CIELAB against everything already in use.  jc = 0 baseline: black.
#
# jc = 0 + dropout 0.1 (run_20260915_134011, 7 seeds, regime C) is a different
# configuration from the no-contrastive baseline (no dropout) and is drawn as its
# own grey entry — it is never pooled with the baseline.
#
# Sources span THREE batch regimes (datamodule.batch_size is PER RANK):
#   A = 1024/rank x 2 GPUs  run_20260819_*, run_20260828_*   (Aug sweeps)
#   B = 2048/rank x 1 GPU   run_20260903_155735              (Sep-3 ladder)
#   C = 2048/rank x 2 GPUs  run_20260915_133955, run_20260922_*  (Sep-15+ runs)
# Per-rank batch is a model hyper-parameter for row attention, so pooled seeds are
# not strictly like-for-like.  Where regimes overlap at the same lambda the
# seed-to-seed spread is of the same size as the regime offset (see the report in
# the chat), which is why the pool follows the established practice of overlaying
# them; the regime of each source is listed above so it can be split if needed.
#
# Excluded:
#   * max_epochs=50 seeds that were still improving when the cap ended them —
#     run_20260819_135557 lambda=0.4 seed_42 (best @ epoch 48) and
#     run_20260819_135709 lambda=0.5 seed_42 (best @ epoch 49)
#   * F2@d6 (run_20260915_134020, run_20260922_095153) — architecture variant
#   * failed runs (run_20260915_110720) and unfinished pilots (no run_info.yaml)
#   * run_20260818_172348 seed_42 — same config AND seed as run_20260819_134452
#     seed_42, so it would count one training twice
# NOTE several 100-epoch seeds (lambda 0.55 / 0.6 / 0.64 / 0.7) reach their
# minimum at epochs 95-99, i.e. they are still improving when max_epochs=100 ends
# them; their stars are lower bounds on what those lambdas can reach.

metric: val/head/loss_ce
seed_status: [completed]

paths:
  root: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan
  r0819_1344: ${paths.root}/run_20260819_134452
  r0819_1355: ${paths.root}/run_20260819_135557
  r0819_1357: ${paths.root}/run_20260819_135709
  r0828_1532: ${paths.root}/run_20260828_153214
  r0828_1636: ${paths.root}/run_20260828_163630
  r0903_1557: ${paths.root}/run_20260903_155735
  r0915_1339: ${paths.root}/run_20260915_133955
