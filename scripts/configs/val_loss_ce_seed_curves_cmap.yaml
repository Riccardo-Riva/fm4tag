# Settings for scripts/plot_best_vs_lambda.py (mean best CE vs lambda); it reads this same file,
# so it uses the same pool, the same colour ramp and the same seed directories as the curve plots:
#
#   .venv/bin/python scripts/plot_best_vs_lambda.py --config scripts/configs/val_loss_ce_seed_curves_cmap.yaml
best_vs_lambda:
  # ---- ALL the wording of the figure lives here: edit freely ---------------------------------------
  # Single-quoted strings are literal, so $\lambda$ needs no escaping; use a `|-` block for a line
  # break.  Strings with {placeholders} are filled in per point / line (listed above each one); a
  # {name} that is not one of them (the {Agg} in $\alpha_{Agg}$) is printed as typed.
  # A text set to null (or '') switches its element OFF: mean_entry = no legend box, tick_outliers = no
  # outlier line under a baseline, tick_stuck / tick_reference_stuck = no "stuck" variant (the plain
  # tick / tick_reference is used instead).
  texts:
    title: 'Cross-Entropy, noise parameter $\lambda$ scan with $\alpha_{Agg} = 0.3$'
    xlabel: 'augmentation strength $\lambda$'
    ylabel: 'Best validation cross-entropy loss (per seed, then mean)'
    legend_title: null
    # legend line of the mean markers: {error_name}, picked from error_name by the `error:` setting below.
    # null = no legend box at all
    mean_entry: |-
      mean best CE ± {error_name} over seeds
      (faint dots: individual seeds; no bar: single seed)
    error_name: {std: standard deviation, sem: standard error, minmax: half range}
    # x tick label of each lambda: {lam}, {n} (= seeds used).  tick_stuck replaces tick for a lambda
    # that lost seeds to the stuck rule; {stuck} = how many.  tick_stuck: null = use tick for those too.
    tick: |-
      {lam:g}
      n={n}
    tick_stuck: |-
      {lam:g}
      n={n}
      ({stuck} stuck)
    # x tick label of each jc = 0 baseline (a point left of the dotted divider): {label} = its name
    # from reference_labels below, {n}, {stuck}; tick_reference_stuck is used if it lost seeds
    # (null = use tick_reference for those too).
    tick_reference: |-
      {label}
      n={n}
    tick_reference_stuck: |-
      {label}
      n={n}
      ({stuck} stuck)
    # extra LAST line under a baseline's tick label when it lost outliers (reference_outliers_above below):
    # {outliers} = how many, {above} = the threshold.  null = no such line.
    tick_outliers: '({outliers} outlier)'
    # footnotes.  {who} is lambda_name for a lambda and the baseline's label for a jc = 0 reference.
    #   note_stuck   : {runs} = the excluded trainings, each written with stuck_run ({who}, {seed}, {run});
    #                  {threshold}, {within} = stuck_check below
    #   note_outliers: {runs} = the cut baseline seeds, each written with outlier_run ({who}, {seed}, {run},
    #                  {best}); {above} = reference_outliers_above below
    #   note_hidden  : {lambdas} = the lambdas under min_seeds, each written with hidden_item ({who}, {n});
    #                  {min_seeds}.  Only appears if min_seeds is raised above 1.
    lambda_name: 'λ = {lam:g}'
    note_stuck: 'Left out as stuck (validation CE never ≤ {threshold:.3f} within the first {within} epochs): {runs}.'
    stuck_run: '{who} seed {seed} ({run})'
    note_outliers: 'Left out of the baselines as outliers (best CE above {above:.3f}): {runs}.'
    outlier_run: '{who} seed {seed} ({run}, best {best:.5f})'
    note_hidden: 'Not shown (fewer than {min_seeds} usable seeds): {lambdas}.'
    hidden_item: '{who} (n={n})'
  # Name of each jc = 0 baseline on the x axis of THIS plot (the key is its `label:` in `models` below;
  # the curve plots keep using that label).  A baseline missing here is shown under its `label:`.
  reference_labels:
    'no contrastive (JC 0.0)': no JC
    'no contrastive + dropout 0.1 (JC 0.0)': |-
      no JC +
      dropout 0.1

  # ---- data and layout -----------------------------------------------------------------------------
  min_seeds: 1          # a lambda needs at least this many usable (= not stuck) seeds to be shown; a single seed gets no error bar
  error: std            # std | sem | minmax  -- across the seeds of one lambda
  filename: val_loss_ce_best_vs_lambda_all.png     # the earlier version (>= 3 seeds only) is val_loss_ce_best_vs_lambda.png
  figsize: [11.0, 5.6]
  # ylim: [0.598, 0.610]

  # Outliers of the two jc = 0 baselines: a baseline seed whose best value is above this is left out of
  # that baseline's mean and error.  These seeds trained normally (they pass the stuck rule below) - they
  # are the baselines' worst seeds - and ONLY the baselines are cut, not the lambda points.  null = keep all.
  reference_outliers_above: 0.606

  # jc = 0 baselines NOT drawn in this plot, by their `label:` in `models` below (a mistyped label is an
  # error).  They stay in the summary CSV, and the footnotes stop mentioning them.  [] = draw them all.
  hide_references: []

  # true = ALSO write the per-seed validation curves (a star at each seed's best value) of exactly the
  # trainings behind this figure to <filename stem>_curves.png: whatever is left out of the figure (stuck,
  # outliers, hidden baselines, lambdas under min_seeds) is left out of the curves too.  Axes, size and
  # legend are those of the `plot:` block below (override any of them in an overlay's own `plot:`).
  curves: false

  # A training is STUCK when its validation CE never gets down to `threshold` within `within_epochs`
  # epochs.  Every healthy run of this campaign does, at epoch 2-15 (61 of 67); the six below need 36+
  # epochs or never do, so any `within_epochs` from 16 to 35 gives the same set.  Stuck trainings are
  # left out of the mean and the error everywhere, scan and baselines alike.  They are listed here
  # explicitly rather than found by the rule, so what is left out is visible and editable; the script
  # only uses the rule to audit this list (it warns about a run that fails the rule but is not listed,
  # or one that is listed but passes it).
  stuck_check:
    threshold: 0.610
    within_epochs: 20
  exclude_broken:
    - ${paths.r0828_1532}/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.4_temp_0.1/seed_42    # lambda 0.4: never; val CE 0.749 -> 0.620 over 98 epochs, best 0.62015 @ep98
    - ${paths.r0922_0951}/scratch_bs_2048_lr_3e-4_ce_1.0_jc_0.3_lam_0.7_temp_0.1/seed_424   # lambda 0.7: first <= 0.610 at ep37, best 0.60725 @ep98 (its seed_42 sibling: ep10, 0.59953)
    - ${paths.r0915_1339}/scratch_bs_2048_lr_3e-4_ce_1.0_jc_0.3_lam_0.8_temp_0.1/seed_424   # lambda 0.8: first <= 0.610 at ep36, best 0.60804 @ep72 (its seed_42 sibling: ep9, 0.60012)
    - ${paths.r0819_1344}/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.0_lam_0.1_temp_0.1/seed_424     # no JC: never; plateau at 0.614, best 0.61263 @ep7
    - ${paths.r0819_1344}/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.0_lam_0.1_temp_0.1/seed_42424   # no JC: never; plateau at 0.614, best 0.61310 @ep6
    - ${paths.r0819_1344}/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.0_lam_0.1_temp_0.1/seed_424242  # no JC: never; plateau at 0.614, best 0.61258 @ep9

color:
  categorical: false
  baseline_color: black                    # every jc == 0 entry without its own `color:`
  cmap: ['#1f3ecc', '#1fa3a0', '#e8b100']  # blue -> teal -> amber
  scale: value
  vmin: 0.0
  vmax: 1.0

plot:
  out_dir: plots/val_loss_ce
