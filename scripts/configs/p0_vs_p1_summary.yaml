# Best validation CE of the six P0 vs P1 cases (scripts/plot_arm_summary.py): from scratch, fine-tuned and frozen
# encoders, each from P0 (CE only) and from P1 (CE + JC downstream; from scratch + JC with the gradient norm clipped
# at 1.0).  Same runs and arms as arm_summary.yaml, the CE-only runs from P1 left out.
#
#   MPLBACKEND=Agg .venv/bin/python scripts/plot_arm_summary.py --config scripts/configs/p0_vs_p1_summary.yaml

arm_summary:
  out_dir: plots/p0_vs_p1/summary
  filename: best_val_ce_p0_vs_p1.png
  stages:
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_final_20261028_235640
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_final_20261028_235642
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_scjc_stab_20261109_175800
  runs_per_arm: 4
  epoch_offset: 1
  ce: {val_metric: val/head/loss_ce}

  arms:
    sc: {encoder: scratch, pretraining: null, jet_contrastive: 0.0, method: scratch, group: p0}
    ft_p0: {encoder: finetune, pretraining: p0, jet_contrastive: 0.0, method: finetune, group: p0}
    fr_p0: {encoder: frozen, pretraining: p0, jet_contrastive: 0.0, method: frozen, group: p0}
    scjc: {encoder: scratch, pretraining: null, jet_contrastive: 0.3, cells: [scjc_clip1], method: scratch, group: p1}
    ftjc_p1: {encoder: finetune, pretraining: p1, jet_contrastive: 0.3, method: finetune, group: p1}
    frjc_p1: {encoder: frozen, pretraining: p1, jet_contrastive: 0.3, method: frozen, group: p1}
  methods: [scratch, finetune, frozen]     # x order
  groups:
    p0: {offset: -0.2, marker: o, filled: true}
    p1: {offset: 0.2, marker: s, filled: false}
  jitter: 0.03                             # x spacing of the single runs of one arm
  mean_offset: 0.0                         # x shift of the mean marker from the arm's position
  colours: {scratch: '#2a78d6', finetune: '#eb6834', frozen: '#1baf7a'}
  ink: '#333333'
  figsize: [7.0, 5.0]

  # Runs left out by name (never by a threshold).  None: no run of these arms collapsed.
  exclude: []

  # ---- ALL the wording of the figure lives here --------------------------------------------------------------
  texts:
    title: 'Best validation cross-entropy, P0 vs P1'   # '' = no title
    ylabel: 'Best validation cross-entropy'
    method: {scratch: 'From scratch', finetune: 'Fine-tuned', frozen: 'Frozen encoders'}
    group: {p0: 'P0 pretraining, CE only', p1: 'P1 pretraining, CE + JC'}
    run: 'One run'
    mean: 'Mean ± std of the runs shown'
    excluded: '+{n} collapsed'           # next to an arm with excluded runs; {n} = how many
    footnote: |-
      4 runs per case.  P0 / P1: pretraining of the fine-tuned and frozen methods (2 pretraining seeds x 2 training
      seeds); from scratch has none (its P1 case is from scratch + JC).
      JC: jet-level contrastive loss, weight 0.3, also in the downstream training.  From scratch + JC: gradient norm
      clipped at 1.0 (without clipping 3 of 4 runs collapsed, with clipping at 5.0 2 of 4).
      Fine-tuned runs from P1 were still improving at the 40-epoch limit.
