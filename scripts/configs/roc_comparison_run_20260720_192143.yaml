# ROC comparison config for scripts/roc_comparison.py
#
# Compares the nine classify-from-scratch runs of run_20260720_192143, a
# 3x3 sweep over learning rate {3e-5, 1e-4, 3e-4} and jet-contrastive loss
# weight {0.0, 0.3, 1.0} (all rowcol, ddp2, bs 1024, ce 1.0).
#
#     python scripts/roc_comparison.py --config scripts/configs/roc_comparison_run_20260720_192143.yaml
#
# Colours are grouped into hue families by learning rate (blue = 3e-5,
# green = 1e-4, red = 3e-4), shaded light -> dark with rising JC weight, so
# both sweep axes read off the colour.  Background class stays the linestyle.

# ── Models: one training-run directory per entry ──────────────────────────────
# checkpoint: best (default) | last | /explicit/path.ckpt
# colour:     optional hex override (default: colour-blind-safe palette in order)
models:
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260720_192143/scratch_20260720_192143_rowcol_ddp2_bs_1024_lr_3e-5_ce_1.0_jc_0.0_0
    label: 'lr 3e-5, CE only'
    colour: '#9ECAE1'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260720_192143/scratch_20260720_192143_rowcol_ddp2_bs_1024_lr_3e-5_ce_1.0_jc_0.3_1
    label: 'lr 3e-5, CE + 0.3 JC'
    colour: '#4292C6'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260720_192143/scratch_20260720_192143_rowcol_ddp2_bs_1024_lr_3e-5_ce_1.0_jc_1.0_2
    label: 'lr 3e-5, CE + 1.0 JC'
    colour: '#08519C'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260720_192143/scratch_20260720_192143_rowcol_ddp2_bs_1024_lr_1e-4_ce_1.0_jc_0.0_3
    label: 'lr 1e-4, CE only'
    colour: '#A1D99B'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260720_192143/scratch_20260720_192143_rowcol_ddp2_bs_1024_lr_1e-4_ce_1.0_jc_0.3_4
    label: 'lr 1e-4, CE + 0.3 JC'
    colour: '#41AB5D'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260720_192143/scratch_20260720_192143_rowcol_ddp2_bs_1024_lr_1e-4_ce_1.0_jc_1.0_5
    label: 'lr 1e-4, CE + 1.0 JC'
    colour: '#006D2C'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260720_192143/scratch_20260720_192143_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_6
    label: 'lr 3e-4, CE only'
    colour: '#FC9272'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260720_192143/scratch_20260720_192143_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.3_7
    label: 'lr 3e-4, CE + 0.3 JC'
    colour: '#EF3B2C'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260720_192143/scratch_20260720_192143_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_1.0_8
    label: 'lr 3e-4, CE + 1.0 JC'
    colour: '#A50F15'

# ── Optional reference taggers (HDF5 score columns) ───────────────────────────
# Uncomment entries to overlay them.  Without `file:` the columns are read from
# the test file itself; with `file:` from an external (e.g. salt) evaluation.
reference_taggers:
#  - label: GN2v01
#    probs: {b: GN2v01_pb, c: GN2v01_pc, u: GN2v01_pu, tau: GN2v01_ptau}
#  - label: DL1dv01
#    probs: {b: DL1dv01_pb, c: DL1dv01_pc, u: DL1dv01_pu}
#    fractions: {c: 0.018}
#  - label: GN2 Open Data
#    file: /storage3/DSIP/rriva/packages/salt-pt/salt/logs/GN2_20251202-T162204/ckpts/epoch=025-val_loss=0.60416__test_pp_output_test.h5
#    probs: {b: GN2_pb, c: GN2_pc, u: GN2_pu, tau: GN2_ptau}
  - label: GN2 only-JT
    file: /storage3/DSIP/rriva/packages/salt-pt/salt/logs/GN2_only_jt_20251208-T171609/ckpts/epoch=012-val_loss=0.61484__test_pp_output_test.h5
    probs: {b: GN2_only_jt_pb, c: GN2_only_jt_pc, u: GN2_only_jt_pu, tau: GN2_only_jt_ptau}

# Label of the tagger used as the ratio-panel reference.
reference: 'GN2 only-JT'

# ── Jets / discriminant ───────────────────────────────────────────────────────
test_file: null  # null → test_dataset_path from the runs' configs (must agree)

cuts:  # applied to all taggers (pt in MeV)
  - [pt, '>', 20000]
  - [pt, '<', 250000]
  - [eta, '>', -2.5]
  - [eta, '<', 2.5]

signal: b
backgrounds: [u, c, tau]
fractions: {c: 0.2, tau: 0.01}  # f_c / f_tau of the D_b denominator (f_u = remainder)

sig_eff: {min: 0.6, max: 1.0, num: 100}
working_points: [0.70, 0.77, 0.85]

# Background rejection / signal efficiency vs pT at a fixed working point.
# Remove this block to skip the pT-profile plots.
eff_vs_pt:
  working_point: 0.77
  bins_gev: [20, 30, 40, 60, 85, 110, 140, 175, 250]
  flat_per_bin: false  # false → one inclusive disc cut; true → per-pT-bin cut

# ── Inference / plotting ──────────────────────────────────────────────────────
inference:
  batch_size: 1024
  num_workers: 8

plot:
  out_dir: plots/roc_run_20260720_192143  # fallback — overridden by --output
  atlas_brand: ''
  atlas_first_tag: 'Simulation Internal'
  atlas_second_tag: "$\\sqrt{s} = 13$ TeV, $t\\bar{t}$\n$20 < p_T < 250$ GeV, $|\\eta| < 2.5$"
  figsize: [7, 7]
  y_scale: 1.3
  dpi: 200
  disc_plot: {bins: 50, range: [-10, 20], logy: false}
