# ROC comparison config for scripts/roc_comparison.py
#
# All eight classify-from-scratch runs of run_20260804_165415 (rowcol, ddp2,
# bs 1024, CE 1.0; lr in {1e-4, 3e-4} x jet_contrastive in {0.0, 0.3, 1.0, 3.0})
# against the 20260817 salt GN2 baselines, both trained on
# data_parallel_preprocess_251112_112022 and evaluated here on fm4tag's own
# test split so every tagger sees the same jets. Colours group by lr — blue
# shades for lr 1e-4, orange shades for lr 3e-4, darkening with jc — with the
# two GN2 baselines in green / magenta so they stand out.
#
#     python scripts/roc_comparison.py --config scripts/configs/roc_comparison_run_20260804_165415_vs_gn2_20260817.yaml

models:
  # ── lr = 1e-4 (blues, darkening with jc) ───────────────────────────────────
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_1e-4_ce_1.0_jc_0.0_4
    label: 'lr 1e-4, no JC'
    colour: '#7fb9da'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_1e-4_ce_1.0_jc_0.3_5
    label: 'lr 1e-4, JC 0.3'
    colour: '#4594c7'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_1e-4_ce_1.0_jc_1.0_6
    label: 'lr 1e-4, JC 1.0'
    colour: '#1a68ae'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_1e-4_ce_1.0_jc_3.0_7
    label: 'lr 1e-4, JC 3.0'
    colour: '#083c7d'

  # ── lr = 3e-4 (oranges, darkening with jc) ─────────────────────────────────
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.0_0
    label: 'lr 3e-4, no JC'
    colour: '#fd9a4e'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_0.3_1
    label: 'lr 3e-4, JC 0.3'
    colour: '#f26c16'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_1.0_2
    label: 'lr 3e-4, JC 1.0'
    colour: '#cb4302'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_from_scratch/run_20260804_165415/scratch_20260804_165415_rowcol_ddp2_bs_1024_lr_3e-4_ce_1.0_jc_3.0_3
    label: 'lr 3e-4, JC 3.0'
    colour: '#8e2d04'

reference_taggers:
  - label: 'GN2 only-JT'
    file: /storage3/DSIP/rriva/packages/salt-pt/salt/logs/GN2_only_jt_20260817-T134649/ckpts/epoch=015-val_loss=0.59814__test_pp_output_test.h5
    probs: {b: GN2_only_jt_pb, c: GN2_only_jt_pc, u: GN2_only_jt_pu, tau: GN2_only_jt_ptau}
    colour: '#228833'
  - label: 'GN2 open data'
    file: /storage3/DSIP/rriva/packages/salt-pt/salt/logs/GN2_open_data_20260817-T121714/ckpts/epoch=015-val_loss=0.59115__test_pp_output_test.h5
    probs: {b: GN2_open_data_pb, c: GN2_open_data_pc, u: GN2_open_data_pu, tau: GN2_open_data_ptau}
    colour: '#AA3377'

# Label of the tagger used as the ratio-panel reference (the requested baseline).
reference: 'GN2 only-JT'

# ── Jets / discriminant ───────────────────────────────────────────────────────
test_file: null  # null → test_dataset_path from the fm4tag runs' config (all agree)

cuts:  # applied to all taggers (pt in MeV)
  - [pt, '>', 20000]
  - [pt, '<', 250000]
  - [eta, '>', -2.5]
  - [eta, '<', 2.5]

signal: b
backgrounds: [u, c, tau]
fractions: {c: 0.2, tau: 0.01}  # f_c / f_tau of the D_b denominator (f_u = remainder)

sig_eff: {min: 0.6, max: 1.0, num: 100}
working_points: [0.70, 0.77, 0.85]

# Background rejection / signal efficiency vs pT at a fixed working point.
eff_vs_pt:
  working_point: 0.77
  bins_gev: [20, 30, 40, 60, 85, 110, 140, 175, 250]
  flat_per_bin: false

# ── Inference / plotting ──────────────────────────────────────────────────────
inference:
  batch_size: 1024
  num_workers: 8

plot:
  out_dir: plots/roc_run_20260804_165415_all_vs_salt_gn2_20260817
  atlas_brand: ''
  atlas_first_tag: 'Simulation Internal'
  atlas_second_tag: "$\\sqrt{s} = 13$ TeV, $t\\bar{t}$\n$20 < p_T < 250$ GeV, $|\\eta| < 2.5$"
  figsize: [7, 7]
  y_scale: 1.3
  dpi: 200
  disc_plot: {bins: 50, range: [-10, 20], logy: false}
