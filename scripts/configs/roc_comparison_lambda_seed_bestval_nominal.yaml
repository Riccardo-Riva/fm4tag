    label: 'λ = 0.25'
    colour: '#2ca02c'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135709/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.3_temp_0.1/seed_42424
    label: 'λ = 0.3'
    colour: '#d62728'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135709/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.35_temp_0.1/seed_424
    label: 'λ = 0.35'
