# Nominal-fraction ROC comparison for the per-token JC=0.3 noise (lambda) scan,
# best-val-CE seed per lambda, vs GN2 only-JT.  All taggers use f_c=0.2,
# f_tau=0.01 here (no per-model optimisation) — this run's real job is to
# populate cache/probs_*.npz on the GPU so the 9x2 constrained-floor grid in
# submit_lambda_seed_fraction_roc.sh runs CPU-only.  Labels match
# fraction_constrained_lambda_seed_bestval.yaml so the cache slugs line up.

models:
