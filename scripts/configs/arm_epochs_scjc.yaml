# Every from-scratch + JC (weight 0.3) training run of the campaign, by recipe (scripts/plot_arm_epochs.py): the
# evidence behind the stabilised recipe used as the CE + JC group's baseline.
#
#   MPLBACKEND=Agg .venv/bin/python scripts/plot_arm_epochs.py --config scripts/configs/arm_epochs_scjc.yaml
#
# Five recipes x 4 seeds (4242, 42424, 424242, 4242424); everything else is the same (batch 14,336, at most 40
# epochs, early stopping on the validation CE):
#   no clipping          F_final (lr 8e-4)                          3 of 4 collapsed
#   clip 5.0             F_scjc_clip                                2 of 4 collapsed
#   clip 1.0             F_scjc_stab, cell scjc_clip1               0 of 4  (the recipe of the CE + JC group)
#   clip 1.0 + warmup    F_scjc_stab, cell scjc_clip1_wu10          warmup 10% of the epochs (4 instead of 0.8)
#   clip 1.0 + lr 4e-4   F_scjc_stab, cell scjc_clip1_lr4           half the peak learning rate
# A run collapsed when its validation CE went above 0.85 after its best epoch had passed within the first 6.  The
# runs of one recipe are the directories of one campaign cell (`cells`), their arm is read from the run's config.
#
# Embeddings: as in arm_epochs.yaml.

arm_epochs:
  out_dir: plots/arm_comparison/epochs_scjc
  stages:
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_final_20261028_235642
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_scjc_clip_20261103_165640
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/F_scjc_stab_20261109_175800
  runs_per_arm: 4
  epoch_offset: 1                    # Lightning counts epochs from 0; 1 = the first epoch is epoch 1

  arms:                              # drawing order = this order (the last one is drawn on top)
    noclip: {encoder: scratch, pretraining: null, jet_contrastive: 0.3, cells: [scjc], colour: '#d0443a'}
    clip5: {encoder: scratch, pretraining: null, jet_contrastive: 0.3, cells: [scjc_clip5], colour: '#eda100'}
    clip1: {encoder: scratch, pretraining: null, jet_contrastive: 0.3, cells: [scjc_clip1], colour: '#2a78d6'}
    clip1_wu10: {encoder: scratch, pretraining: null, jet_contrastive: 0.3, cells: [scjc_clip1_wu10], colour: '#7b4bc4'}
    clip1_lr4: {encoder: scratch, pretraining: null, jet_contrastive: 0.3, cells: [scjc_clip1_lr4], colour: '#00a0b0'}

  ce:
    filename: ce_train_val.png
    train_metric: train/head/loss_ce_epoch   # epoch mean of the training CE
    val_metric: val/head/loss_ce              # also picks each run's best epoch (run_selection.csv)
    figsize: [8.0, 5.0]
    # ylim: [0.5, 0.75]                   # y range of `filename`; unset = automatic
    zoom_filename: ce_train_val_zoom.png    # a copy at y range `zoom_ylim`; null = none
    zoom_ylim: [0.58, 0.9]

  embedding_figures:                 # metric -> file; panels = `embeddings`, column val/<embedding>/<metric>
    effective_rank: effective_rank.png
    uniformity: uniformity.png
  embeddings: [tracks_embedding, jets_embedding, aggregator]
  embedding_figsize: [14.0, 4.2]

  linewidth: 1.3
  alpha: 0.85
  linestyles: {train: '--', val: '-'}
  ink: '#333333'                     # the black lines of the train/validation legend entries
  # A star on each run's lowest validation CE (its evaluated checkpoint) and, at that epoch, on each of its
  # embedding curves (not necessarily at their own extreme there).  null = no stars.
  best_marker: {marker: '*', size: 10, edge: white, edge_width: 0.5}

  # ---- ALL the wording of the figures lives here --------------------------------------------------------------
  texts:
    arm:                             # legend entry per arm
      noclip: 'No clipping'
      clip5: 'Clip 5.0'
      clip1: 'Clip 1.0'
      clip1_wu10: 'Clip 1.0 + warmup 10%'
      clip1_lr4: 'Clip 1.0 + lr 4e-4'
    xlabel: 'Epoch'
    best_epoch: 'At the epoch of the run''s lowest validation CE'   # legend of the stars, embedding figures
    ce:
      title: 'Training and validation cross-entropy, from scratch + JC, 4 runs per recipe'   # '' = no title
      ylabel: 'Cross-entropy'
      train: 'Training (epoch mean)'
      val: 'Validation'
      best: 'Lowest validation CE of each run'   # legend of the stars
      zoom_title: 'Training and validation cross-entropy, from scratch + JC, 4 runs per recipe (zoom)'   # title of the zoomed copy
    effective_rank:
      title: 'Effective rank of the embeddings (validation), from scratch + JC, 4 runs per recipe'
      ylabel: 'Effective rank'
    uniformity:
      title: 'Uniformity of the embeddings (validation, lower = more uniform), from scratch + JC, 4 runs per recipe'
      ylabel: 'Uniformity'
    panel:                           # one panel title per embedding
      tracks_embedding: 'Track embeddings'
      jets_embedding: 'Jet-feature embedding'
      aggregator: 'Global jet embedding'
