# Test-set rejections of every final run of the compared training methods, with their spread over seeds
# (scripts/arm_test_metrics.py).  The GPU step runs as slurm/arm_roc/arm_test_metrics_job.sh (2 GPUs), or:
#
#   .venv/bin/python scripts/arm_test_metrics.py --config scripts/configs/arm_test_metrics.yaml --infer --part 0/2
#   .venv/bin/python scripts/arm_test_metrics.py --config scripts/configs/arm_test_metrics.yaml --metrics --workers 16
#
# Runs and arms: as in arm_epochs.yaml (every completed run under `stages`, put in an arm by its own .hydra
# config; 4 runs per arm).  From scratch + JC is not scored: 5 of its 8 runs collapsed (with or without gradient
# clipping), and rriva decided on 2026-11-04 to report it as unstable.

arm_test_metrics:
  out_dir: plots/arm_comparison/test_metrics
  stages:
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235640
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235642
  runs_per_arm: 4
  epoch_offset: 1
  ce: {val_metric: val/head/loss_ce}       # picks each run's best epoch (and its checkpoint)
  arms:
    sc: {encoder: scratch, pretraining: null, jet_contrastive: 0.0}
    ft_p0: {encoder: finetune, pretraining: p0, jet_contrastive: 0.0}
    fr_p0: {encoder: frozen, pretraining: p0, jet_contrastive: 0.0}
    ftjc_p1: {encoder: finetune, pretraining: p1, jet_contrastive: 0.3}
    frjc_p1: {encoder: frozen, pretraining: p1, jet_contrastive: 0.3}

  val_file: /storage3/DSIP/rriva/datasets/transforming-jet-flavor/data_parallel_preprocess_251112_152051/val/output/pp_output_val.h5
  test_file: /storage3/DSIP/rriva/datasets/transforming-jet-flavor/data_parallel_preprocess_251112_152051/test/output/pp_output_test.h5
  cuts:                                    # pt in MeV, as in roc_comparison_arms_final.yaml
    - [pt, '>', 20000]
    - [pt, '<', 250000]
    - [eta, '>', -2.5]
    - [eta, '<', 2.5]

  # Reference tagger: its scores are columns of both files; its rejections on val set the search floors.
  reference:
    label: GN2v01
    probs: {b: GN2v01_pb, c: GN2v01_pc, u: GN2v01_pu, tau: GN2v01_ptau}
    fractions: {c: 0.2, tau: 0.01}

  nominal_fractions: {c: 0.2, tau: 0.01}
  working_points: [0.70, 0.77, 0.80, 0.85]

  # Per-run (f_c, f_tau) on val: max c-rejection at working_point with light and tau rejection >= floor_frac x the
  # reference's (the standing ROC convention); grid f_c in [0, fc_max) x f_tau in [0, ftau_max) at `step`.
  # The 6 best-seed models had their optima at f_c <= 0.05 and f_tau <= 0.07; an optimum on the box edge is flagged
  # in per_run.csv (grid_edge).
  search: {working_point: 0.8, floor_frac: 1.0, step: 0.002, fc_max: 0.15, ftau_max: 0.12}

  # bf16 autocast as in training; batch a multiple of chunk_size 512.
  inference: {batch_size: 28672, num_workers: 8, precision: bf16}
