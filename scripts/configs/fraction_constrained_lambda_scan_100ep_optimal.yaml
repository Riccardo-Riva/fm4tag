roc_comparison:
  # Sasha Trubetskoy's "20 simple, distinct colors" (saturated subset — see
  # scripts/configs/val_loss_ce_seed_curves.yaml for the same palette used
  # there, kept consistent across both plots).
  colours:
    - '#000000'  # no JC
    - '#e6194b'  # 0.05  red
    - '#0082c8'  # 0.1   blue
    - '#f58231'  # 0.2   orange
    - '#911eb4'  # 0.25  purple
    - '#46f0f0'  # 0.3   cyan
    - '#f032e6'  # 0.35  magenta
    - '#3cb44b'  # 0.4   green
    - '#008080'  # 0.45  teal
    - '#800000'  # 0.5   maroon
    - '#808000'  # 0.55  olive
    - '#000080'  # 0.6   navy
    - '#aa6e28'  # 0.65  brown
  reference_tagger:
    label: 'GN2 only-JT'
    file: /storage3/DSIP/rriva/packages/salt-pt/salt/logs/GN2_only_jt_20260817-T134649/ckpts/epoch=015-val_loss=0.59814__test_pp_output_test.h5
    probs: {b: GN2_only_jt_pb, c: GN2_only_jt_pc, u: GN2_only_jt_pu, tau: GN2_only_jt_ptau}
    fractions: {c: 0.2, tau: 0.01}
    colour: '#EE6677'
  plot:
    out_dir: plots/roc_lambda_scan_100ep_optimal_vs_gn2
    atlas_brand: ''
    atlas_first_tag: 'Simulation Internal'
    atlas_second_tag: "$\\sqrt{s} = 13$ TeV, $t\\bar{t}$\n$20 < p_T < 250$ GeV, $|\\eta| < 2.5$"
    figsize: [7, 7]
    y_scale: 1.3
    dpi: 200
    disc_plot: {bins: 50, range: [-10, 20], logy: false}
