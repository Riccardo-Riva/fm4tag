# Constrained f_c / f_tau search for the current jc=0.3 lambda ladder
# (max_epochs=100 sources + the reinstated max_epochs=50 seeds whose minimum
# was reached well inside their budget — see scripts/configs/
# val_loss_ce_seed_curves.yaml for the exact inclusion/exclusion rule).
#
# One model per lambda: the single seed across ALL available sources (old
# 50-epoch sweeps, the 828/903 100-epoch reseeds, and this week's rescued
# run_20260915_133955) with the lowest val/head/loss_ce for that lambda, plus
# the JC=0.0 baseline's best seed. F2@d6 (architecture scan, not the lambda
# ladder) is excluded. For each model, grid-search the (f_c, f_tau) simplex
# and pick the point maximising c-rejection subject to
#   u_rejection   >= floor_u   * GN2_only_JT u_rejection
#   tau_rejection >= floor_tau * GN2_only_JT tau_rejection
# at the signal-efficiency working point. floor_u / floor_tau / working_point
# are set on the CLI; the values here are only fallbacks.
#
#   python scripts/fraction_constrained_search.py \
#       --config scripts/configs/fraction_constrained_lambda_scan_100ep_optimal.yaml \
#       --floor-u 0.95 --floor-tau 0.90 --working-point 0.77 --workers 32
#
# Config is parsed as plain YAML (no ${..} interpolation) — dirs are absolute.

step: 0.002
signal: b
working_point: 0.77         # campaign's constrained c-rej@0.77 metric; CLI --working-point overrides
test_file: null             # -> test_dataset_path from the runs' own config (all agree)

cuts:                       # pt in MeV
  - [pt, '>', 20000]
  - [pt, '<', 250000]
  - [eta, '>', -2.5]
  - [eta, '<', 2.5]

inference:
  batch_size: 1024
  num_workers: 8

models:
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_134452/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.0_lam_0.1_temp_0.1/seed_4242424
    label: 'no JC'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135557/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.05_temp_0.1/seed_4242424
    label: 'λ = 0.05'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_134452/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.1_temp_0.1/seed_424242
    label: 'λ = 0.1'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260903_155735/scratch_bs_2048_lr_3e-4_ce_1.0_jc_0.3_lam_0.2_temp_0.1/seed_42
    label: 'λ = 0.2'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135557/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.25_temp_0.1/seed_42424
