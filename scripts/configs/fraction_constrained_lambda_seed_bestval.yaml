# Constrained f_c / f_tau search for the per-token JC=0.3 noise (lambda) scan.
#
# One model per lambda: the SEED with the lowest val/head/loss_ce of that cell
# (classify_param_scan, per-token rowcol_v0, bs 1024/rank, lr 3e-4, temp 0.1),
# plus the JC=0.0 baseline's best seed.  For each model, grid-search the
# (f_c, f_tau) simplex and pick the point maximising c-rejection subject to
#   u_rejection   >= floor_u   * GN2_only_JT u_rejection
#   tau_rejection >= floor_tau * GN2_only_JT tau_rejection
# at the signal-efficiency working point.  floor_u / floor_tau / working_point
# are set on the CLI (--floor-u --floor-tau --working-point); the values here
# are only fallbacks.
#
#   python scripts/fraction_constrained_search.py \
#       --config scripts/configs/fraction_constrained_lambda_seed_bestval.yaml \
#       --floor-u 0.95 --floor-tau 0.90 --working-point 0.77 --workers 64
#
# Config is parsed as plain YAML (no ${..} interpolation) — dirs are absolute.
# Predictions depend only on checkpoint+test-file, so once any run over these
# 8 models has populated cache/probs_*.npz this never touches the GPU
# (see submit_lambda_seed_fraction_roc.sh).

step: 0.002
signal: b
working_point: 0.8          # CLI --working-point overrides
test_file: null             # -> test_dataset_path from the runs' own config (all agree)

cuts:                       # pt in MeV
  - [pt, '>', 20000]
  - [pt, '<', 250000]
  - [eta, '>', -2.5]
  - [eta, '<', 2.5]

inference:
  batch_size: 1024
  num_workers: 8

models:
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_134452/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.0_lam_0.1_temp_0.1/seed_4242424
    label: 'no JC'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135557/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.05_temp_0.1/seed_4242424
    label: 'λ = 0.05'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_134452/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.1_temp_0.1/seed_424242
    label: 'λ = 0.1'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135557/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.25_temp_0.1/seed_42424
    label: 'λ = 0.25'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135709/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.3_temp_0.1/seed_42424
    label: 'λ = 0.3'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135709/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.35_temp_0.1/seed_424
    label: 'λ = 0.35'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135557/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.4_temp_0.1/seed_42
    label: 'λ = 0.4  (n=1, ep48)'
  - dir: /storage3/DSIP/rriva/research/fm4tag/slurm/classify_param_scan/run_20260819_135709/scratch_bs_1024_lr_3e-4_ce_1.0_jc_0.3_lam_0.5_temp_0.1/seed_42
    label: 'λ = 0.5  (n=1, ep49)'

roc_comparison:
  colours:
    - '#000000'  # no JC
    - '#1f77b4'  # 0.05
    - '#ff7f0e'  # 0.1
    - '#2ca02c'  # 0.25
    - '#d62728'  # 0.3
    - '#9467bd'  # 0.35
    - '#8c564b'  # 0.4
    - '#e377c2'  # 0.5
  reference_tagger:
    label: 'GN2 only-JT'
    file: /storage3/DSIP/rriva/packages/salt-pt/salt/logs/GN2_only_jt_20260817-T134649/ckpts/epoch=015-val_loss=0.59814__test_pp_output_test.h5
    probs: {b: GN2_only_jt_pb, c: GN2_only_jt_pc, u: GN2_only_jt_pu, tau: GN2_only_jt_ptau}
    fractions: {c: 0.2, tau: 0.01}
    colour: '#EE6677'
  plot:
    out_dir: plots/roc_lambda_seed_bestval_vs_gn2
    atlas_brand: ''
    atlas_first_tag: 'Simulation Internal'
    atlas_second_tag: "$\\sqrt{s} = 13$ TeV, $t\\bar{t}$\n$20 < p_T < 250$ GeV, $|\\eta| < 2.5$"
    figsize: [7, 7]
    y_scale: 1.3
    dpi: 200
    disc_plot: {bins: 50, range: [-10, 20], logy: false}
