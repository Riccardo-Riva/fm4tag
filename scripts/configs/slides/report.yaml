# ── Slides ───────────────────────────────────────────────────────────────────
# layouts: title | section | models_table | plots (1 or 2 `plots`, the `models` they show, optional `info_items`)
slides:
  - layout: title
    title: 'SSL campaign: the plots'
    subtitle: 'Contrastive pretraining of the fm4tag encoders (P0, P1) and three ways to train the tagger on it. Every plot, with the settings of the models it shows.'

  - layout: models_table
    title: 'The two pretrainings'
    subtitle: 'Settings read from each run''s configuration, training log and data files; parameters as counted by Lightning at the start of training.'
    models: [p0, p1]
  - layout: models_table
    title: 'The six training methods'
    subtitle: 'CE only (pretrained ones from P0) and CE + JC (pretrained ones from P1), 4 runs each; same sources.'
    models: [sc, ft_p0, fr_p0, scjc, ftjc_p1, frjc_p1]

  # ---- Pretraining ----
  - layout: section
    title: 'Pretraining'
    subtitle: 'P0: contrastive loss on the feature embeddings (tracks and jet features). P1: P0 + JC, a contrastive loss on the global jet embedding. 30 epochs on the 39.7M-jet pretraining split, 2 seeds each.'
  - layout: plots
    title: 'P0: total loss and its terms'
    subtitle: 'Seed 42 (left) and 424 (right). Training dashed (mean over the epoch), validation solid; the total is the weighted sum of the terms.'
    plots: [pretrain_curves/final/p0_s42_loss_terms.png, pretrain_curves/final/p0_s424_loss_terms.png]
    models: [p0]
  - layout: plots
    title: 'P0: loss and effective rank of the embeddings'
    subtitle: 'Seed 42 (left) and 424 (right). Left axis: total loss. Right axis, dashed: effective rank of each trained embedding on 8192 validation jets (at most the embedding size).'
    plots: [pretrain_curves/final/p0_s42_loss_and_effective_rank.png, pretrain_curves/final/p0_s424_loss_and_effective_rank.png]
    models: [p0]
  - layout: plots
    title: 'P0: loss and uniformity of the embeddings'
    subtitle: 'Seed 42 (left) and 424 (right). Left axis: total loss. Right axis, dashed: uniformity of each trained embedding on 8192 validation jets (lower = more evenly spread).'
    plots: [pretrain_curves/final/p0_s42_loss_and_uniformity.png, pretrain_curves/final/p0_s424_loss_and_uniformity.png]
    models: [p0]
  - layout: plots
    title: 'P1: total loss and its terms'
    subtitle: 'Seed 42 (left) and 424 (right). Training dashed (mean over the epoch), validation solid; the total is the weighted sum of the terms, JC included.'
    plots: [pretrain_curves/final/p1_s42_loss_terms.png, pretrain_curves/final/p1_s424_loss_terms.png]
    models: [p1]
  - layout: plots
    title: 'P1: loss and effective rank of the embeddings'
    subtitle: 'Seed 42 (left) and 424 (right). Left axis: total loss. Right axis, dashed: effective rank on 8192 validation jets; P1 also trains the global jet embedding.'
    plots: [pretrain_curves/final/p1_s42_loss_and_effective_rank.png, pretrain_curves/final/p1_s424_loss_and_effective_rank.png]
    models: [p1]
  - layout: plots
    title: 'P1: loss and uniformity of the embeddings'
    subtitle: 'Seed 42 (left) and 424 (right). Left axis: total loss. Right axis, dashed: uniformity on 8192 validation jets (lower = more evenly spread).'
    plots: [pretrain_curves/final/p1_s42_loss_and_uniformity.png, pretrain_curves/final/p1_s424_loss_and_uniformity.png]
    models: [p1]

  # ---- Training, CE only ----
  - layout: section
    title: 'Training, CE only'
    subtitle: 'From scratch, fine-tuned from P0, and frozen P0 encoders (only the aggregator and the head train), with the cross-entropy alone: 4 runs each on 18.6M labelled jets.'
  - layout: plots
    title: 'CE only: training and validation cross-entropy'
    subtitle: 'Every run (4 per method): training dashed (mean over the epoch), validation solid. Right: the same, zoomed.'
    plots: [arm_comparison/epochs/ce_train_val.png, arm_comparison/epochs/ce_train_val_zoom.png]
    models: [sc, ft_p0, fr_p0]
  - layout: plots
    title: 'CE only: effective rank of the embeddings'
    subtitle: 'Track, jet-feature and global jet embeddings on 8192 validation jets, every run. Frozen encoders: flat lines.'
    plots: [arm_comparison/epochs/effective_rank.png]
    models: [sc, ft_p0, fr_p0]
  - layout: plots
    title: 'CE only: uniformity of the embeddings'
    subtitle: 'Track, jet-feature and global jet embeddings on 8192 validation jets (lower = more evenly spread), every run.'
    plots: [arm_comparison/epochs/uniformity.png]
    models: [sc, ft_p0, fr_p0]
  - layout: plots
    title: 'CE only: test ROC, fixed fractions'
    subtitle: 'Test set (1.86M jets), one run per method, f_c = 0.2 and f_τ = 0.01. Ratio panels: to from scratch (left), to GN2v01 (right).'
    plots: [arm_comparison/roc_test_nominal_noref/roc.png, arm_comparison/roc_test_nominal/roc.png]
    models: [roc_sc, roc_ft_p0, roc_fr_p0]
  - layout: plots
    title: 'CE only: test ROC, optimised fractions'
    subtitle: 'Each model at its own (f_c, f_τ) from the validation set: the largest c-rejection at 80% b-efficiency with light and τ rejection at least GN2v01''s. Ratio to from scratch (left), to GN2v01 (right).'
    plots: [arm_comparison/roc_test_optimal_noref/roc.png, arm_comparison/roc_test_optimal/roc.png]
    models: [roc_sc, roc_ft_p0, roc_fr_p0]

  # ---- Training, CE + JC ----
  - layout: section
    title: 'Training, CE + JC'
    subtitle: 'The same three methods with the JC term (weight 0.3) on the global jet embedding; the pretrained ones start from P1. 4 runs each.'
  - layout: plots
    title: 'CE + JC: training and validation cross-entropy'
    subtitle: 'Every run (4 per method): training dashed, validation solid. From scratch + JC: 3 of its 4 runs collapsed (cross-entropy about 1.29), off scale on the right.'
    plots: [arm_comparison/epochs_p1/ce_train_val.png, arm_comparison/epochs_p1/ce_train_val_zoom.png]
    models: [scjc, ftjc_p1, frjc_p1]
  - layout: plots
    title: 'CE + JC: effective rank of the embeddings'
    subtitle: 'Track, jet-feature and global jet embeddings on 8192 validation jets, every run (the collapsed from-scratch runs drop to a rank of about 2).'
    plots: [arm_comparison/epochs_p1/effective_rank.png]
    models: [scjc, ftjc_p1, frjc_p1]
  - layout: plots
    title: 'CE + JC: uniformity of the embeddings'
    subtitle: 'Track, jet-feature and global jet embeddings on 8192 validation jets (lower = more evenly spread), every run.'
    plots: [arm_comparison/epochs_p1/uniformity.png]
    models: [scjc, ftjc_p1, frjc_p1]
  - layout: plots
    title: 'CE + JC: test ROC, fixed fractions'
    subtitle: 'Test set (1.86M jets), one run per method, f_c = 0.2 and f_τ = 0.01. Ratio panels: to from scratch + JC (left), to GN2v01 (right).'
    plots: [arm_comparison_p1/roc_test_nominal_noref/roc.png, arm_comparison_p1/roc_test_nominal/roc.png]
    models: [roc_scjc, roc_ftjc_p1, roc_frjc_p1]
  - layout: plots
    title: 'CE + JC: test ROC, optimised fractions'
    subtitle: 'Each model at its own (f_c, f_τ) from the validation set, as for CE only. Ratio to from scratch + JC (left), to GN2v01 (right).'
    plots: [arm_comparison_p1/roc_test_optimal_noref/roc.png, arm_comparison_p1/roc_test_optimal/roc.png]
    models: [roc_scjc, roc_ftjc_p1, roc_frjc_p1]

  # ---- Both groups ----
  - layout: section
    title: 'CE only and CE + JC together'
    subtitle: 'Best validation cross-entropy and test rejections of every run, the two groups side by side.'
  - layout: plots
    title: 'Best validation cross-entropy per method'
    subtitle: 'Every run (small) and the mean ± std of the runs shown (large). Filled: CE only (pretrained from P0); open: CE + JC (pretrained from P1). The 3 collapsed from-scratch + JC runs are not shown.'
    plots: [arm_comparison/summary/best_val_ce_per_method.png]
    models: [sc, ft_p0, fr_p0, scjc, ftjc_p1, frjc_p1]
    info_items: [start, trained, params, loss, batch, lr, epochs, data]
  - layout: plots
    title: 'Test rejection at 77% b-efficiency, fixed fractions'
    subtitle: 'c-, light- and τ-jet rejection on the test set with f_c = 0.2 and f_τ = 0.01: every run (small) and mean ± std (large). From scratch + JC is not shown (unstable).'
    plots: [arm_comparison/test_metrics/test_rejections_nominal_wp77.png]
    models: [sc, ft_p0, fr_p0, ftjc_p1, frjc_p1]
    info_items: [start, trained, params, loss, batch, lr, epochs, data]
  - layout: plots
    title: 'Test rejection at 77% b-efficiency, optimised fractions'
    subtitle: 'The same, each run at its own (f_c, f_τ) from the validation search.'
    plots: [arm_comparison/test_metrics/test_rejections_optimal_wp77.png]
    models: [sc, ft_p0, fr_p0, ftjc_p1, frjc_p1]
    info_items: [start, trained, params, loss, batch, lr, epochs, data]
  - layout: plots
    title: 'Test rejection at 77%, optimised fractions, with GN2v01'
    subtitle: 'As before; dashed line: GN2v01 at f_c = 0.2 and f_τ = 0.01 (the production tagger, trained on other data).'
    plots: [arm_comparison/test_metrics/test_rejections_optimal_wp77_gn2.png]
    models: [sc, ft_p0, fr_p0, ftjc_p1, frjc_p1]
    info_items: [start, trained, params, loss, batch, lr, epochs, data]
  - layout: plots
    title: 'Test rejection at 70% b-efficiency, optimised fractions'
    subtitle: 'Each run at its own (f_c, f_τ) from the validation search.'
    plots: [arm_comparison/test_metrics/test_rejections_optimal_wp70.png]
    models: [sc, ft_p0, fr_p0, ftjc_p1, frjc_p1]
    info_items: [start, trained, params, loss, batch, lr, epochs, data]
  - layout: plots
    title: 'Test rejection at 85% b-efficiency, optimised fractions'
    subtitle: 'Each run at its own (f_c, f_τ) from the validation search.'
    plots: [arm_comparison/test_metrics/test_rejections_optimal_wp85.png]
    models: [sc, ft_p0, fr_p0, ftjc_p1, frjc_p1]
    info_items: [start, trained, params, loss, batch, lr, epochs, data]

  # ---- Fewer labels ----
  - layout: section
    title: 'Fewer labels'
    subtitle: 'From scratch, fine-tuned from P0 and frozen P0 encoders with 1–30% of the labelled jets: learning-rate and regularisation checks at 3%, then the label-fraction scan.'
  - layout: plots
