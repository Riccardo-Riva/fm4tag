# Every plot of the SSL report, one or two per slide, each with the settings of the models it shows
# (scripts/report_deck.py):
#
#   sbatch slurm/plot_job.sh scripts/report_deck.py:scripts/configs/slides/report.yaml
#
# The info box of a slide is built from the runs of its `models` only (config, training log, data files); nothing
# about a model is written here except its label, colour and run directories.  All wording lives here.

output:
  dir: docs/slides/report              # relative to the repo
  pptx: ssl_campaign_plots.pptx
  preview: preview                     # drawings of the slides (subdirectory of dir); null = none

footer: 'SSL campaign plots · fm4tag-chunk, branch feat/chunked-ia'
updated_label: 'updated'
plots_dir: plots                       # relative to the repo; slide `plots` are relative to it
missing_plot: 'Plot not found: {files}'

style:
  deck_font: Arial
  measure_fonts: [Liberation Sans, DejaVu Sans]   # the first installed one measures text (Arial metrics or wider)
  ink: '#1b1d21'
  muted: '#5b5e66'
  accent: '#c98500'
  accent_ink: '#7a4f00'
  card_tint: '#fbf3e4'
  header_fill: '#2b2f36'
  dark_bg: '#1e2227'
  dark_ink: '#ffffff'
  dark_muted: '#c9ccd1'
  status: {}
  title_size: 26
  subtitle_size: 13
  table_size: 11
  table_label_width: 1.9               # inches

# ── The info box ─────────────────────────────────────────────────────────────
info:
  # The info box goes under the plots (full width) or beside them (one of side_widths, inches): whichever shows the
  # plots largest.  Text and table font sizes [pt, pt] are tried from the first pair on; the first pair that leaves
  # the plots min_plot_scale of their native size is used (else the layout with the largest plots).
  font_sizes: [[10, 9.5], [9.5, 9], [9, 8.5], [8.5, 8]]
  side_widths: [3.4, 4.2, 5.2, 6.4, 7.4]
  min_plot_scale: 0.5
  min_column_width: 0.8                # a beside-table with narrower model columns (inches) is not tried: its text overflows
  box_fill: '#f3f3f0'
  join: ' · '
  label_sep: ': '
  values_sep: ' / '                    # between the values of a `per_run` item (seeds)
  common_label: 'Same for every model'  # settings equal in every model / configuration, as one paragraph
  common_sep: ' – '
  missing: '–'
  table_corner: ''
  texts:                               # words the values are built from
    on_off: {true: 'on', false: 'off'}
    none: 'none'
    views_join: ' and '
    augmentations_join: ' + '
    start:                             # {seed} = the pretraining run's seed
      none: 'random'
      p0: 'P0, pretraining seed {seed}'
      p1: 'P1, pretraining seed {seed}'
      p2: 'P2, pretraining seed {seed}'
    trained:                           # by method; any field of the run can be used
      scratch: 'all'
      finetune: 'all; the pretrained parts are held at lr 0 for the first {unfreeze} epochs'
      frozen: 'aggregator and head (encoders frozen)'
    aggregator: {trained: 'trained', untrained: 'not trained'}
    lr_pretrained: '{lr} (pretrained parts {backbone})'   # fine-tuning: head lr and the pretrained parts' lr
  # Items in this order; `value` is formatted with the run's fields (scripts/report_deck.py run_fields).
  # per_run: merge the values of the runs of a configuration (seeds); only_if: skip when 0.  Runs with equal
  # non-per_run texts form one configuration of a model (one learning rate, one label fraction, ...).
  items:
    pretrain:
      - {key: seed, label: 'seed', value: '{seed}', per_run: true}
      - {key: params, label: 'parameters', value: '{params_total} ({params_trained} trained)'}
      - {key: loss, label: 'loss weights', value: 'contrastive {w_contrastive:g} (track and jet-feature embeddings), JC {w_jet_contrastive:g} (global jet embedding), denoising {w_denoising_cat:g} + {w_denoising_con:g}'}
      - {key: temperature, label: 'temperature', value: '{t_contrastive:g}, JC {t_jet_contrastive:g}'}
      - {key: views, label: 'views', value: '{views}, λ {lam:g}'}
      - {key: encoders, label: 'encoders', value: 'dim {enc_dim}, {enc_depth} blocks, intersample attention ({row_mode}) in chunks of {chunk} jets, QK-norm {qk_norm}, projection {proj_out}'}
      - {key: aggregator, label: 'aggregator', value: '{agg_depth} blocks, {agg_heads} heads × {agg_dim_head}, {agg_state}'}
      - {key: batch, label: 'batch', value: '{batch:,}'}
      - {key: lr, label: 'learning rate', value: '{lr_s}'}
      - {key: optimiser, label: 'optimiser', value: 'AdamW, weight decay {wd_s}, cosine schedule, {warmup:.0%} warmup'}
      - {key: epochs, label: 'epochs', value: '{max_epochs}, gradient clipping {clip_s}'}
      - {key: precision, label: 'precision', value: '{precision}'}
      - {key: data, label: 'data', value: '{n_train_s} training jets (pretraining split), {n_val_s} validation jets'}
    finetune:
      - {key: seed, label: 'seed', value: '{seed}', per_run: true}
      - {key: start, label: 'init', value: '{start}', per_run: true}
      - {key: trained, label: 'trained', value: '{trained}'}
      - {key: params, label: 'parameters', value: '{params_total} ({params_trained} trained)'}
      - {key: loss, label: 'loss weights', value: 'CE {w_cross_entropy:g}, JC {w_jet_contrastive:g}'}
      - {key: jc, label: 'JC', value: 'temperature {t_jet_contrastive:g}, views {views}, λ {lam:g}', only_if: w_jet_contrastive}
      - {key: batch, label: 'batch', value: '{batch:,}'}
      - {key: lr, label: 'learning rate', value: '{lr_text}'}
      - {key: optimiser, label: 'optimiser', value: 'AdamW, weight decay {wd_s}, cosine schedule, {warmup:.0%} warmup'}
      - {key: epochs, label: 'epochs', value: 'at most {max_epochs}, early-stopping patience {patience} on the validation CE'}
      - {key: clip, label: 'gradient clipping', value: '{clip_s}'}
      - {key: precision, label: 'precision', value: '{precision}'}
      - {key: encoders, label: 'encoders', value: 'dim {enc_dim}, {enc_depth} blocks, intersample attention ({row_mode}) in chunks of {chunk} jets, QK-norm {qk_norm}, projection {proj_out}'}
      - {key: aggregator, label: 'aggregator', value: '{agg_depth} blocks, {agg_heads} heads × {agg_dim_head}, dropout {agg_dropout:g}'}
      - {key: head, label: 'head', value: 'MLP {head_hidden}, dropout {head_dropout:g}'}
      - {key: data, label: 'data', value: '{n_train_s} training jets, {n_val_s} validation'}

