# ── Slides ───────────────────────────────────────────────────────────────────
# layouts: title | section | models_table | plots (1 or 2 `plots`, the `models` they show, optional `info_items`)
slides:
  - layout: title
    title: 'SSL campaign: the plots'
    subtitle: 'Contrastive pretraining of the fm4tag encoders (P0, P1) and three ways to train the tagger on it. Every plot, with the settings of the models it shows.'

  - layout: models_table
    title: 'The two pretrainings'
    subtitle: 'Settings read from each run''s configuration, training log and data files; parameters as counted by Lightning at the start of training.'
    models: [p0, p1]
  - layout: models_table
    title: 'The eight training methods'
    subtitle: 'CE only (pretrained ones from P0 or P1) and CE + JC (pretrained ones from P1), 4 runs each; from scratch + JC with gradient clipping at 1.0. Same sources.'
    models: [sc, ft_p0, fr_p0, ft_p1, fr_p1, scjc, ftjc_p1, frjc_p1]

  # ---- Pretraining ----
  - layout: section
    title: 'Pretraining'
    subtitle: 'P0: contrastive loss on the feature embeddings (tracks and jet features). P1: P0 + JC, a contrastive loss on the global jet embedding. 30 epochs on the 39.7M-jet pretraining split, 2 seeds each.'
  - layout: plots
    title: 'P0: total loss and its terms'
    subtitle: 'Seed 42 (left) and 424 (right). Training dashed (mean over the epoch), validation solid; the total is the weighted sum of the terms. A star marks the lowest validation total and, at that epoch, each term.'
    plots: [pretrain_curves/final/p0_s42_loss_terms.png, pretrain_curves/final/p0_s424_loss_terms.png]
    models: [p0]
  - layout: plots
    title: 'P0: loss and effective rank of the embeddings'
    subtitle: 'Seed 42 (left) and 424 (right). Left axis: total loss. Right axis, dashed: effective rank of each trained embedding on 8192 validation jets (at most the embedding size). Stars: the lowest validation loss and the embedding curves at that epoch.'
    plots: [pretrain_curves/final/p0_s42_loss_and_effective_rank.png, pretrain_curves/final/p0_s424_loss_and_effective_rank.png]
    models: [p0]
  - layout: plots
    title: 'P0: loss and uniformity of the embeddings'
    subtitle: 'Seed 42 (left) and 424 (right). Left axis: total loss. Right axis, dashed: uniformity of each trained embedding on 8192 validation jets (lower = more evenly spread). Stars: the lowest validation loss and the embedding curves at that epoch.'
    plots: [pretrain_curves/final/p0_s42_loss_and_uniformity.png, pretrain_curves/final/p0_s424_loss_and_uniformity.png]
    models: [p0]
  - layout: plots
    title: 'P1: total loss and its terms'
    subtitle: 'Seed 42 (left) and 424 (right). Training dashed (mean over the epoch), validation solid; the total is the weighted sum of the terms, JC included. A star marks the lowest validation total and, at that epoch, each term.'
    plots: [pretrain_curves/final/p1_s42_loss_terms.png, pretrain_curves/final/p1_s424_loss_terms.png]
    models: [p1]
  - layout: plots
    title: 'P1: loss and effective rank of the embeddings'
    subtitle: 'Seed 42 (left) and 424 (right). Left axis: total loss. Right axis, dashed: effective rank on 8192 validation jets; P1 also trains the global jet embedding. Stars: the lowest validation loss and the embedding curves at that epoch.'
    plots: [pretrain_curves/final/p1_s42_loss_and_effective_rank.png, pretrain_curves/final/p1_s424_loss_and_effective_rank.png]
    models: [p1]
  - layout: plots
    title: 'P1: loss and uniformity of the embeddings'
    subtitle: 'Seed 42 (left) and 424 (right). Left axis: total loss. Right axis, dashed: uniformity on 8192 validation jets (lower = more evenly spread). Stars: the lowest validation loss and the embedding curves at that epoch.'
    plots: [pretrain_curves/final/p1_s42_loss_and_uniformity.png, pretrain_curves/final/p1_s424_loss_and_uniformity.png]
    models: [p1]

  # ---- Training, CE only ----
  - layout: section
    title: 'Training, CE only'
    subtitle: 'From scratch, fine-tuned and frozen encoders (only the aggregator and the head train) from P0 and from P1, with the cross-entropy alone: 4 runs each on 18.6M labelled jets.'
  - layout: plots
    title: 'CE only: training and validation cross-entropy'
    subtitle: 'Every run (4 per method): training dashed (mean over the epoch), validation solid. Right: the same, zoomed. A star marks each run''s lowest validation CE.'
    plots: [arm_comparison/epochs/ce_train_val.png, arm_comparison/epochs/ce_train_val_zoom.png]
    models: [sc, ft_p0, fr_p0, ft_p1, fr_p1]
  - layout: plots
    title: 'CE only: effective rank of the embeddings'
    subtitle: 'Track, jet-feature and global jet embeddings on 8192 validation jets, every run. Frozen encoders: flat lines. A star marks the epoch of each run''s lowest validation CE.'
    plots: [arm_comparison/epochs/effective_rank.png]
    models: [sc, ft_p0, fr_p0, ft_p1, fr_p1]
    info_items: *backup_items
  - layout: plots
    title: 'CE only: uniformity of the embeddings'
    subtitle: 'Track, jet-feature and global jet embeddings on 8192 validation jets (lower = more evenly spread), every run. A star marks the epoch of each run''s lowest validation CE.'
    plots: [arm_comparison/epochs/uniformity.png]
    models: [sc, ft_p0, fr_p0, ft_p1, fr_p1]
    info_items: *backup_items
  - layout: plots
    title: 'CE only: test ROC, fixed fractions (ratio to from scratch)'
    subtitle: 'Test set (1.86M jets), one run per method, f_c = 0.2 and f_τ = 0.01. Ratio panels: to from scratch.'
    plots: [arm_comparison/roc_test_nominal_noref/roc.png]
    models: [roc_sc, roc_ft_p0, roc_fr_p0, roc_ft_p1, roc_fr_p1]
  - layout: plots
    title: 'CE only: test ROC, fixed fractions (ratio to GN2v01)'
    subtitle: 'Test set (1.86M jets), one run per method and GN2v01, f_c = 0.2 and f_τ = 0.01. Ratio panels: to GN2v01.'
    plots: [arm_comparison/roc_test_nominal/roc.png]
