# The SSL campaign slides: what is tested, the results (plots), the decisions.
# A living deck — build it from the fm4tag-chunk worktree with
#
#   uv run --no-sync --with python-pptx python scripts/ssl_campaign_slides.py \
#       --config scripts/configs/slides/ssl_campaign.yaml
#
# To update: edit this file (status, decisions, new slides) and re-run. Every
# plot re-reads its runs, so finished runs appear by themselves; a plot with no
# data yet shows its `placeholder` text instead. All wording lives here.

output:
  dir: docs/slides/ssl_campaign        # relative to the repo; plots go in <dir>/plots
  pptx: ssl_campaign.pptx

footer: 'SSL campaign · fm4tag-chunk, branch feat/chunked-ia'
updated_label: 'updated'
decision_label: 'Decision'
result_label: 'Result'
decides_label: 'decides'

style:
  font: Liberation Sans                # plots; metric twin of the deck's Arial
  deck_font: Arial
  ink: '#1b1d21'
  muted: '#5b5e66'
  grid: '#e3e3e0'
  dark_bg: '#1e2227'
  dark_ink: '#ffffff'
  dark_muted: '#c9ccd1'
  accent: '#c98500'                    # decision cards and the title slide's date
  accent_ink: '#7a4f00'
  card_tint: '#fbf3e4'
  header_fill: '#2b2f36'
  status:                              # fill, text — always shown with a label
    done:    ['#e3f1e3', '#1e6b1e']
    running: ['#fbf3e4', '#7a4f00']
    queued:  ['#eeeeec', '#52514e']
    planned: ['#eeeeec', '#52514e']
    failed:  ['#fbe4e4', '#a12a2a']
  # One colour per entity, the same on every plot.
  colors:
    P0: '#2a78d6'
    P1: '#eb6834'
    P2: '#1baf7a'
    P2c: '#6250d6'                     # P2 rerun with gradient clipping
    random: '#8a8984'
    per_token: '#6250d6'
    concat: '#008300'
    SC: '#6250d6'
    SCJC: '#6250d6'
    FR: '#008300'
    FRJC: '#008300'
    bar: '#2a78d6'
    bar_muted: '#b7d3f6'

data:
  s0_table: /storage3/DSIP/rriva/research/fm4tag/slurm/profiling/s0_20261016_103150_a40/table.csv
  firstlook_table: /storage3/DSIP/rriva/research/fm4tag/slurm/profiling/firstlook_20261015_230859/table.csv
  aggpacked_table: /storage3/DSIP/rriva/research/fm4tag/slurm/profiling/aggpacked_20261016_093645/table.csv
  loader_bench: /storage3/DSIP/rriva/research/fm4tag/slurm/smoke/loader/out_6470015.txt
  s1_stage: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/S1_arch_20261016_121444
  # Stage directories searched (globs allowed) for a cell; the first that has it wins.
  s2_stages:
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/S2_pretrain_20261019_102325
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/S2_p1_20261020_112148
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/S2_probe_20261020_112146
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/S2_probe_p2T03_*
    - /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/S2_p2clip_20261020_145001
  # Row-attention logits per checkpoint (slurm/smoke/attn_logits.py, 2026-10-22)
  row_attn_csv: /storage3/DSIP/rriva/research/fm4tag/docs/slides/ssl_campaign/data/row_attn_logits.csv

# ── Plots ────────────────────────────────────────────────────────────────────
plots:
  model:
    size: [7.2, 5.6]
    texts:
      tracks_in: "tracks of the jet"
      jets_in: "global jet features"
      track_enc: "track encoder\ncolumn + intersample\nattention"
      jet_enc: "jet-feature encoder\ncolumn + intersample\nattention"
      track_emb: "track embeddings"
      jet_emb: "jet-feature embedding"
      aggregator: "aggregator: attention over\nthe jet's tracks, mean pool"
      global_emb: "global jet embedding = [ jet-feature emb. ; pooled tracks ]"
      head: "head: b / c / light / τ, cross-entropy (CE)"
      loss_feat: "contrastive on the\nfeature embeddings\nP0, P1"
      loss_jc: "contrastive on the\nglobal jet embedding (JC)\nP1, P2, +JC arms"
      chunk_note: "intersample attention and contrastive losses: within chunks of C jets"

  efficiency:
    size: [6.2, 5.3]
    bars:                               # (table, point) of the L40S profiles
      - {table: firstlook_table, point: pt_nochunk_bs1024, label: "before: whole-batch\nintersample attn, B 1024"}
      - {table: firstlook_table, point: pt_c256_bs4096, label: "chunks of 256 jets,\nB 4096"}
      - {table: aggpacked_table, point: pt_c256_bs4096, label: "+ aggregator on\nvalid tracks only"}
      - {table: aggpacked_table, point: cc_c256_bs4096, label: "+ SAINT-like (concat)\nintersample attn"}
    texts:
      title_speed: "Training speed, one L40S (fine-tune + JC)"
      xlabel_speed: "thousand jets per second"
      value_fmt: "{k:.1f}k jets/s  ·  {gib:.1f} GiB per 1k jets"
      title_loader: "Reading one batch of 4096 jets"
      xlabel_loader: "milliseconds"
      cold: "files not in page cache"
      warm: "files in page cache"
      ms_fmt: "{ms:.0f} ms"

  s0_speed:
    size: [12.3, 3.9]
    panels:
      - {arm: P1, title: "Pretraining P1 (B 4096, A40)"}
      - {arm: SCJC, title: "From scratch + JC (B 4096, A40)"}
    texts:
      xlabel: "chunk size C (jets)"
      ylabel: "thousand jets per second"
      per_token: "per-feature (per_token)"
      concat: "SAINT-like (concat)"
      candidates: "S1 candidates"

  s0_memory:
    size: [8.3, 4.9]
    row_mode: cc
    chunk: 256
    target_gib: 38
    card_gib: 44.4
    x_max: 34000
    arms:                                # arm in the S0 table: label, chosen batch, linestyle
      - {arm: SC,   label: "from scratch / fine-tune", batch: 26624, ls: '-'}
      - {arm: SCJC, label: "from scratch + JC",        batch: 14336, ls: '--'}
      - {arm: P0,   label: "pretraining P0",           batch: 16384, ls: '-'}
      - {arm: P1,   label: "pretraining P1",           batch: 12288, ls: '-'}
      - {arm: FR,   label: "frozen encoders",          batch: 32768, ls: '-'}
      - {arm: FRJC, label: "frozen encoders + JC",     batch: 32768, ls: '--'}
    texts:
      xlabel: "batch B (thousand jets)"
      ylabel: "peak GPU memory (GiB)"
      target: "target ~38 GiB"
      card: "card limit"
      measured: "measured (B 4096, 8192)"
      chosen: "chosen batch"
      arm_fmt: "{label}: B {batch}"

  s1:
    size: [12.3, 4.0]
    cells:                               # cell dir: row mode, chunk, label
      - {cell: sc_pt_c128, mode: per_token, chunk: 128, label: "per-feature, C 128"}
      - {cell: sc_pt_c512, mode: per_token, chunk: 512, label: "per-feature, C 512"}
      - {cell: sc_cc_c128, mode: concat, chunk: 128, label: "SAINT-like, C 128"}
      - {cell: sc_cc_c512, mode: concat, chunk: 512, label: "SAINT-like, C 512"}
    linestyle: {128: '--', 512: '-'}
    ylim: [0.615, 0.67]
    texts:
      title_curves: "Validation CE per epoch (from scratch, 2 seeds per cell)"
      xlabel: "epoch"
      ylabel: "validation cross-entropy"
      best_marker: "best epoch"
      title_best: "Best validation CE"
      seed: "one seed"

  s2_loss:
    size: [12.3, 5.4]
    rows:                                # pretraining: cell-name prefix
      - {key: P0, label: "P0", prefix: p0}
      - {key: P1, label: "P1 (clipped)", short: "P1", prefix: p1}
      - {key: P2, label: "P2", prefix: p2}
      - {key: P2c, label: "P2 (clipped)", short: "P2 clip", prefix: p2c}
    recipes:
      - {suffix: T0.1_lam0.1, label: "T 0.1, λ 0.1"}
      - {suffix: T0.1_lam0.4, label: "T 0.1, λ 0.4"}
      - {suffix: T0.3_lam0.1, label: "T 0.3, λ 0.1"}
      - {suffix: T0.3_lam0.4, label: "T 0.3, λ 0.4"}
    texts:
      xlabel: "epoch"
      ylabel: "train loss"
      lr_peak: "lr peak"
      queued: "queued"
      no_data: "no data yet"

  s2_collapse:
    size: [8.6, 5.2]
    rows: [P0, P1, P2, P2c]               # pretraining kinds drawn (s2_loss rows)
    recipes: [T0.1_lam0.1, T0.1_lam0.4, T0.3_lam0.1, T0.3_lam0.4]
    metrics:
      - {column: val/tracks_embedding/uniformity, label: "track embeddings:\nuniformity (0 = all equal)"}
      - {column: val/aggregator/effective_rank, label: "global jet embedding:\neffective rank"}
    texts:
      xlabel: "epoch"

  s2_probes:
    size: [12.3, 3.9]
    rows: [P0, P1, P2, P2c]
    recipes: [T0.1_lam0.1, T0.1_lam0.4, T0.3_lam0.1, T0.3_lam0.4]
    probe_prefix: fr_
    floor_cell: fr_random
    ylim: [0.62, 0.76]                    # points above: a marker on the top edge with their value
    metric: val/head/loss_ce
    texts:
      ylabel: "best validation CE\n(frozen-encoder probe)"
      floor: "frozen random encoders"
      running: "running, epoch {epoch}/{epochs}"
      completed: "done"
      pending: "pending"
      off_scale: "{value:.2f}"
    placeholder: >-
      The probes are running. This plot fills in as they finish: best validation
      CE of the frozen-encoder probe of each pretraining recipe, against the same
      probe on frozen random encoders.

  full_runs:
    size: [12.3, 4.1]
    val_metric: val/loss
    spike_level: 200
    runs:                                # the stopped 30-epoch pretrainings (lr 1e-3)
      - {stage: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/P_full_20261021_112456, cell: p0, seed: 42, key: P0, label: "P0, seed 42"}
      - {stage: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/P_full_20261021_112456, cell: p0, seed: 424, key: P0, label: "P0, seed 424", ls: '--'}
      - {stage: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/P_full_20261021_161637, cell: p1, seed: 42, key: P1, label: "P1, seed 42"}
      - {stage: /storage3/DSIP/rriva/research/fm4tag/slurm/ssl_campaign/P_full_20261021_161637, cell: p1, seed: 424, key: P1, label: "P1, seed 424", ls: '--'}
    texts:
      xlabel: "epoch"
      ylabel_val: "validation loss"
      ylabel_grad: "largest gradient norm\nper 500 steps (before clipping)"
      spike_level: "never above this in the clipped S2 runs"

  attn_logits:
    size: [8.4, 5.6]
    table: row_attn_csv
    layers:                              # layer in the CSV: legend label, marker
      - {layer: L0b0.2, label: "1st intersample block", marker: o}
      - {layer: L0b1.2, label: "2nd intersample block", marker: s, filled: false}
    groups:                              # checkpoint labels in the CSV; epochs counted from 1
      - key: concat                     # S1's SAINT-like colour
        label: "from scratch"
        entries: [{label: S1_scratch_s42, tick: "s42"}, {label: S1_scratch_s424, tick: "s424"}]
      - key: mixed                      # no single colour: label in ink
        label: "S2 winners"
        entries: [{label: S2_P0, tick: "P0", key: P0}, {label: S2_P1, tick: "P1", key: P1}, {label: S2_P2c, tick: "P2", key: P2c}]
      - key: P0
        label: "P0 s42"
        entries: [{label: full_P0_s42_ep1, tick: "ep 2"}, {label: full_P0_s42_ep2, tick: "ep 3"}, {label: full_P0_s42_ep4, tick: "ep 5"}]
      - key: P0
        label: "P0 s424"
        entries: [{label: full_P0_s424_ep4, tick: "ep 5"}, {label: full_P0_s424_ep6, tick: "ep 7"}]
      - key: P1
        label: "P1 s42"
        entries: [{label: full_P1_s42_ep5, tick: "ep 6"}, {label: full_P1_s42_ep7, tick: "ep 8"}]
      - key: P1
        label: "P1 s424"
        entries: [{label: full_P1_s424_ep4, tick: "ep 5"}, {label: full_P1_s424_ep6, tick: "ep 7"}]
    texts:
      ylabel_logit: "largest logit q·k/√d"
      ylabel_entropy: "attention entropy\n(1 uniform, 0 one-hot)"

  # Figures made by other scripts (scripts/plot_arm_epochs.py, plot_arm_summary.py, roc_comparison.py), used as
  # they are: `file` is relative to the repo; re-run those scripts to update them.
  final_summary:
    file: plots/arm_comparison/summary/best_val_ce_per_method.png
    placeholder: "Run scripts/plot_arm_summary.py"
  curves_p0:
    file: plots/arm_comparison/epochs/ce_train_val_zoom.png
    placeholder: "Run scripts/plot_arm_epochs.py (arm_epochs.yaml)"
  curves_p1:
    file: plots/arm_comparison/epochs_p1/ce_train_val_zoom.png
    placeholder: "Run scripts/plot_arm_epochs.py (arm_epochs_p1.yaml)"
  curves_p1_full:
    file: plots/arm_comparison/epochs_p1/ce_train_val.png
    placeholder: "Run scripts/plot_arm_epochs.py (arm_epochs_p1.yaml)"
  rank_p0:
    file: plots/arm_comparison/epochs/effective_rank.png
    placeholder: "Run scripts/plot_arm_epochs.py (arm_epochs.yaml)"
  roc_p0_noref:
    file: plots/arm_comparison/roc_test_nominal_noref/roc.png
    placeholder: "Run slurm/arm_roc/arm_roc_job.sh"
  roc_p1_noref:
    file: plots/arm_comparison_p1/roc_test_nominal_noref/roc.png
    placeholder: "Run slurm/arm_roc/arm_roc_job.sh with the _p1 configs"
  roc_p0_gn2:
    file: plots/arm_comparison/roc_test_optimal/roc.png
    placeholder: "Run slurm/arm_roc/arm_roc_job.sh"
  test_rej_nominal:
    file: plots/arm_comparison/test_metrics/test_rejections_nominal_wp77.png
    placeholder: "Run scripts/plot_test_rejections.py"
  test_rej_optimal:
    file: plots/arm_comparison/test_metrics/test_rejections_optimal_wp77.png
    placeholder: "Run scripts/plot_test_rejections.py"
  lr_check_curves:
    file: plots/label_scan/lr_check/ce_per_epoch.png
    placeholder: "Run scripts/plot_method_scan.py (method_scan_lr.yaml)"
  reg_check_best:
    file: plots/label_scan/reg_check/best_val_ce_vs_regularisation.png
    placeholder: "Run scripts/plot_method_scan.py (method_scan_reg.yaml)"

# ── Slides ───────────────────────────────────────────────────────────────────
# layouts: title | text_plot | plot_full | tables | stages | cards
slides:
  - layout: title
    title: "Does contrastive pretraining help jet flavour tagging?"
    subtitle: "SSL campaign on the SAINT-like fm4tag encoders: what we test, the results, the decisions"

  - layout: text_plot
    title: "What we test"
    plot: model
    bullets:
      - "Pretrain the encoders (column + intersample attention) with a contrastive loss on their feature embeddings, then train the tagger with cross-entropy"
      - "Compare with the same tagger trained from scratch, and with the pretrained encoders frozen"
      - "Repeat with a contrastive loss on the global jet embedding (JC), in pretraining and downstream"
      - "Side questions: SAINT-like (concat) or per-feature intersample attention; chunks of jets so the batch can fill the GPU"

  - layout: tables
    title: "The tests"
    tables:
      - caption: "Pretraining (pretrain split, 39.7M jets, labels unused)"
        widths: [0.9, 5.2, 2.3, 3.9]
        header: ["id", "loss", "aggregator", "status"]
        status_col: 3
        rows:
          - ["P0", "contrastive on the feature embeddings (tracks, global jet features)", "not trained", "done: 30 epochs, 2 seeds (QK-norm)"]
          - ["P1", "P0 + JC on the global jet embedding", "trained", "done: 30 epochs, 2 seeds (QK-norm)"]
          - ["P2", "JC on the global jet embedding only", "trained", "done: 30 epochs; no downstream arm for now"]
      - caption: "Downstream (train split, 18.6M jets, cross-entropy always on)"
        widths: [4.3, 2.7, 2.7, 2.6]
        header: ["arm", "without JC", "with JC (weight 0.3)", "status"]
        status_col: 3
        rows:
          - ["FT: fine-tune the pretrained model", "FT ← P0", "FT ← P1, + JC", "done: 4 runs each"]
          - ["SC: whole tagger from scratch", "SC", "SC + JC", "done; SC + JC unstable"]
          - ["FR: encoders frozen, aggregator + head train", "FR ← P0", "FR ← P1, + JC", "done: 4 runs each"]
    note: "The JC column switches JC on in pretraining and downstream at once; if it wins, FT ← P1 and FR ← P1 without JC tell which half helped. Data: data_parallel_preprocess_251112_152051, splits disjoint by eventNumber; reference tagger GN2v01."

  - layout: text_plot
    title: "Code: chunked intersample attention, faster training"
    plot: efficiency
    text_width: 5.4
    bullets:
      - "ISAB removed: intersample attention is all-pairs within chunks of C jets, on flash varlen kernels"
      - "The contrastive losses use the same chunks: negatives come from the chunk, no gather across GPUs"
      - "So the batch can fill the GPU while the cost per jet stays flat"
      - "The aggregator runs on the valid tracks only (82% of the padded track slots are empty)"
      - "Data: one sequential read of the files at job start puts them in the page cache"
    result: "2.7× the jets per second of the start of the campaign, at half the memory per jet."

  - layout: stages
    title: "Plan: small staged grids, a decision at every gate"
    stages:
      - {name: "S0", what: "benchmark: speed and memory of every arm, both row modes, chunk and batch scans", decides: "chunk candidates, batch per arm", status: done}
      - {name: "S1", what: "from scratch: per-feature vs SAINT-like × C 128 / 512, 2 seeds", decides: "intersample attention, chunk size", status: done}
      - {name: "S2", what: "P0, P1, P2 × temperature × augmentation, each with a frozen probe", decides: "recipe of each pretraining", status: done}
      - {name: "S3", what: "learning rate of each of the 6 arms (3 values)", decides: "learning rate per arm", status: running}
      - {name: "Final", what: "2 pretraining seeds × 2 downstream seeds per arm; SC × 4 seeds", decides: "the answer", status: planned}
    note: "Every run is identified from its own .hydra config, never from its directory name. At most 10 GPU jobs per user: runs go in 2-GPU packs that share one task queue."

  - layout: plot_full
    title: "S0: speed vs chunk size"
    plot: s0_speed
    decision: "SAINT-like (concat) is 1.3–1.7× faster than per-feature over C 128–512 and nearly flat in C (−3%); per-feature slows by about 18% from 128 to 512. S1 tests C = 128 and 512 with both."

  - layout: text_plot
    title: "S0: batch per arm fills the GPU"
    plot: s0_memory
    plot_left: true
    text_width: 3.9
    bullets:
      - "Peak memory is linear in the batch; the chunk size sets the attention context, not the batch"
      - "Each arm gets the largest batch (multiple of 8 · C) under ~38 GiB"
      - "B 16384 failed in S0 (a CUDA grid limit above 65535 packed tracks), fixed since"
    decision: "Batch per arm (concat): SC / FT 26624, +JC 14336, P0 16384, P1 12288 at C 256; frozen arms capped at 32768. S2 pretrains at C 512 with 12288."

  - layout: plot_full
    title: "S1: per-feature vs SAINT-like intersample attention"
    plot: s1
    decision: "Same CE within seed noise (best 0.620–0.621; one SAINT-like C 512 seed started slowly, 0.632), concat 1.45× faster: SAINT-like (concat) with C = 512. Every run peaks at epoch 7–10, so downstream trainings get 40 epochs."

  - layout: tables
    title: "S2: choosing each pretraining's recipe"
    tables:
      - caption: "Grid: temperature T {0.1, 0.3} × augmentation strength λ {0.1, 0.4}; 10 epochs, B 12288, lr 1e-3"
        widths: [1.2, 5.1, 2.6, 3.4]
        header: ["id", "loss", "gradient clipping", "status"]
        status_col: 3
        rows:
          - ["P0", "contrastive on the feature embeddings", "no", "done: best T 0.1, λ 0.4"]
          - ["P1", "P0 + JC (same T for both)", "1.0", "done: best T 0.1, λ 0.4"]
          - ["P2", "JC only", "no", "done: T 0.1; T 0.3 stopped (collapsed)"]
          - ["P2 rerun", "JC only", "1.0", "done: best T 0.1, λ 0.4"]
          - ["QK‑norm", "P0, P1, P2 at their recipes, QK-norm in the intersample attention", "1.0", "done: all beat random"]
    bullets_title: "How a recipe is judged: a probe"
    bullets:
      - "Freeze the pretrained encoders, train aggregator + head with CE for 15 epochs (B 32768, lr 1e-3); compare the best validation CE"
      - "Pretraining losses are not comparable across T and λ; the probe's CE is"
      - "Floor: the same probe on frozen random encoders"

  - layout: plot_full
    title: "S2: loss spikes after the lr peak; clipping tames them"
    plot: s2_loss
    result: "Unclipped: P0 recovered within a few hundred steps; P2 sat on a plateau (T 0.1) or collapsed (T 0.3). Clipped at 1.0: P1 smooth; P2 clipped has no long plateau and no full collapse, but T 0.3, λ 0.1 keeps spiking."

  - layout: text_plot
    title: "S2: P2 collapses without clipping, much less with it"
    plot: s2_collapse
    plot_left: true
    text_width: 3.6
    bullets:
      - "The global jet embedding contains the jet-feature embedding as is: JC alone can be solved from pT and η"
      - "Unclipped: every track got the same embedding (T 0.1); at T 0.3 every jet did (rank ≈ 1)"
      - "Clipped (violet): no full collapse (rank 79–139); tracks keep some spread, except at T 0.3, λ 0.1"
    decision: "Clip gradients at 1.0 in every pretraining from now on: P1 gets its own grid, clipped, and the P2 grid is rerun clipped. The collapsed T 0.3 runs were stopped."

  - layout: plot_full
    title: "S2 probes: pretrained vs random frozen encoders"
    plot: s2_probes
    decision: "P0: T 0.1, λ 0.4 (probe CE 0.635, frozen random encoders 0.656; T 0.1, λ 0.1 close at 0.641, one seed). P1: T 0.1, λ 0.4 again (0.632; next best 0.647). P2: T 0.1, λ 0.4 (clipped, 0.648; random 0.656). Unclipped P2 is far worse than random (0.83, 1.17)."

  - layout: plot_full
    title: "30-epoch pretrainings: sudden gradient blowups"
    plot: full_runs
    result: "P0 seed 42 collapsed at epoch 5 (every track the same embedding), P0 seed 424 broke at epoch 11, P1 seed 42 spiked at epoch 8; P1 seed 424 ran out of GPU memory at epoch 8 (allocator fragmentation). Each break starts with one step whose gradient norm is 10³–10⁶; after it, blowups recur even at lower lr. The other three runs were stopped."

  - layout: text_plot
    title: "Cause: the intersample attention turns one-hot"
    plot: attn_logits
    text_width: 3.7
    bullets:
      - "Track encoder, first two intersample blocks: the query/key weights keep growing, logits reach 10⁵–10⁷"
      - "Each track attends to one other track of its chunk; bf16 rounding flips the winner: gradient blowups"
      - "From scratch ~20; every pretraining drifts, the S2 winners too. A lower lr only slows it"
    decision: "QK-norm (q, k RMS-normalised per head) in every arm's intersample attention; largest logit and entropy logged each epoch. First a 10-epoch pilot."

  - layout: plot_full
    title: "Final runs: training from scratch is best"
    plot: final_summary
    result: "Fine-tuning a pretrained model is 0.005–0.007 worse than training from scratch, frozen encoders 0.020–0.026 worse. JC helps the pretrained arms (−0.002 FT, −0.006 FR) but does not close the gap."

  - layout: text_plot
    title: "Without JC, every method overfits early"
    plot: curves_p0
    bullets:
      - "Validation CE bottoms out at epoch ~10 (from scratch), 5–6 (fine-tuned), 6–8 (frozen)"
      - "Training CE keeps falling to 0.50–0.56; validation climbs to ~0.68–0.70"
      - "Fine-tuned has the lowest training CE at every epoch, and overfits first"
      - "4 runs per method; the seeds agree closely"

  - layout: text_plot
    title: "With JC, the pretrained methods stop overfitting"
    plot: curves_p1
    bullets:
      - "Fine-tuned (P1) + JC: training 0.605, validation 0.629 at epoch 40, still at its minimum"
      - "Frozen (P1) + JC: validation within 0.002 of its best at the end"
      - "From scratch + JC still overfits after epoch 11 (its one run that did not collapse)"
      - "Fine-tuned trains its pretrained parts at lr / 10, so this is not JC alone"

  - layout: plot_full
    title: "Pretraining gives richer embeddings, not a better tagger"
    plot: rank_p0
    result: "Effective rank after P0 pretraining: track embeddings 114–121 vs 52–66 from scratch, jet-feature embedding ~62 vs ~10. Fine-tuning keeps most of it, frozen encoders all of it (flat lines). Yet the from-scratch model classifies best: the spread of the embeddings does not predict the tagging performance."

  - layout: text_plot
    title: "Test ROC: pretrained methods below training from scratch"
    plot: roc_p0_noref
    bullets:
      - "Best seed of each method, test set (1.86M jets), the same fractions for all (f_c 0.2, f_τ 0.01)"
      - "Ratio panels: relative to the from-scratch model"
      - "Fine-tuned: 0.8–1.0× on every background; frozen: 0.5–1.0×"
      - "At 77% b-efficiency, light / c / τ rejection: from scratch 267 / 12.1 / 43, fine-tuned 233 / 11.4 / 34, frozen 195 / 9.8 / 31"

  - layout: text_plot
    title: "Test ROC with JC: closer, still below training from scratch"
    plot: roc_p1_noref
    bullets:
      - "Same plot for the methods with JC (pretrained ones from P1)"
      - "At 77%: from scratch + JC 265 / 12.3 / 41, fine-tuned 254 / 11.3 / 36, frozen 224 / 10.3 / 32"
      - "JC lifts both pretrained methods; neither reaches the from-scratch model"

  - layout: text_plot
    title: "Against GN2v01, ATLAS's production tagger"
    plot: roc_p0_gn2
    bullets:
      - "Each model at its own fractions, optimised on the validation set: maximal c-rejection at 80% with light and τ rejection ≥ GN2v01's"
      - "c-rejection at 80%: from scratch 7.1, fine-tuned 6.1, frozen 3.9 (cannot reach GN2v01's light and τ together), GN2v01 10.4"
      - "GN2v01 is trained by ATLAS on far more jets: a yardstick, not a same-data baseline"

  - layout: plot_full
    title: "Test set over 4 seeds: fixed fractions"
    plot: test_rej_nominal
    result: "Light / c / τ rejection at 77%, mean ± std of 4 runs: from scratch 257 ± 11 / 12.0 ± 0.5 / 37 ± 4, fine-tuned 239 ± 8 / 11.1 ± 0.3 / 35 ± 1, frozen 193 ± 5 / 9.7 ± 0.1 / 26 ± 3; with JC: fine-tuned 257 ± 3 / 11.3 ± 0.02 / 36.3 ± 0.3, frozen 216 ± 6 / 10.1 ± 0.2 / 31 ± 2. From scratch varies most between seeds; the seed on the ROC slides is its best on τ (43 vs a mean of 37)."

  - layout: plot_full
    title: "Test set over 4 seeds: optimised fractions"
    plot: test_rej_optimal
    result: "With light and τ rejection held at GN2v01's level, c-rejection at 77%: from scratch 9.7 ± 0.6, fine-tuned + JC 9.0 ± 0.06, fine-tuned 8.3 ± 0.4, frozen + JC 6.4 ± 0.7, frozen 4.7 (reaches the two floors in none of its runs); GN2v01 15.6. The ranking holds over seeds, but from scratch's worst seed (8.9) sits at fine-tuned + JC's mean. Test CE equals the best val CE within 0.0005 in every run."

  - layout: text_plot
    title: "From scratch + JC is unstable"
    plot: curves_p1_full
    bullets:
      - "5 of 8 runs collapsed: 3 of 4 without gradient clipping, 2 of 4 with clipping at 5.0"
      - "One 100-step window with a gradient norm of 27–77: the track embeddings collapse to a point, the CE goes to the class priors (1.29)"
      - "The encoders' attention logits stay at 5–9: not the pretraining instability"
      - "Clipping the gradient norm does not bound Adam's update"
    decision: "Stopped (rriva, 4 Nov): reported as unstable; its healthy runs (0.6208 / 0.6211 / 0.6347) are no better than from scratch."

  - layout: tables
    title: "Fewer labels; why the CE is ~0.62 here"
    tables:
      - caption: "10% of the labels (1.86M jets), one seed per method, learning rates not tuned for it"
        widths: [5.0, 2.4, 4.9]
        header: ["method", "best val CE", "note"]
        rows:
          - ["From scratch", "0.695", "epoch 9"]
          - ["Fine-tuned (P0)", "0.727", "best of 2 learning rates; train 0.44 / val 1.06 at the end"]
          - ["Frozen encoders (P0)", "0.746", "train 0.46 / val 1.05 at the end"]
      - caption: "Control: the earlier studies reached ~0.60 on another dataset (112022), one seed each"
        widths: [5.0, 2.4, 4.9]
        header: ["run", "best val CE", "reading"]
        rows:
          - ["Current model and recipe on 112022 (2.8× more distinct training jets)", "0.604", "within the earlier CE-only runs (best 0.600): the data size sets the level"]
          - ["Batch 2048 (the earlier batch) on the current data", "0.622", "the same as batch 28,672: the batch does not matter"]

  - layout: plot_full
    title: "3% of the labels: every method overfits within a few epochs"
    plot: lr_check_curves
    result: "Learning-rate check (558k jets, lr 3e-4 / 6e-4 / 1.2e-3, one seed). Best val CE: from scratch 0.719, fine-tuned 0.765, frozen 0.780; the lr moves it by ≤ 0.009, the gaps are 6× and 2× those at full data. Best epoch 3–8, then val CE climbs to 0.9 (from scratch) and 1.3–2.1 (pretrained) while training CE falls to 0.1: the pretrained methods memorise fastest."

  - layout: plot_full
    title: "3% of the labels: regularisation does not narrow the gap"
    plot: reg_check_best
    result: "Weight decay 0.05, dropout 0.1 (aggregator feed-forward and head), or both, each method at its best lr, one seed. The best val CE moves by ≤ 0.003 and the best epoch not at all; fine-tuned stays 0.047 and frozen 0.062 above training from scratch. At the best epoch training and validation CE are still equal: the pretrained methods reach a worse minimum, they do not overfit their way to it. Dropout only slows the climb after it."

  - layout: tables
    title: "Decisions so far (1/3)"
    tables:
      - widths: [1.5, 6.2, 4.6]
        header: ["date", "decision", "based on"]
        rows:
          - ["2026-10-15", "One dataset (152051) with disjoint splits; contrastive-only pretraining; small staged grids, no Optuna; each arm fills the GPU", "the plan"]
          - ["2026-10-15", "ISAB removed; intersample attention within chunks of jets", "request; S0 cost per jet"]
          - ["2026-10-16", "Chunk candidates 128 and 512; batch per arm; frozen arms capped at 32768", "S0"]
          - ["2026-10-19", "SAINT-like (concat), C = 512, 40 downstream epochs", "S1"]
          - ["2026-10-19", "P2 added: pretraining with JC only", "request"]
          - ["2026-10-19", "2-GPU packs sharing a task queue", "10-GPU-job limit"]
          - ["2026-10-20", "Gradient clipping 1.0 in pretraining; P1 gets its own S2 grid", "S2 loss spikes, P2 collapse"]
          - ["2026-10-20", "P2 grid rerun with clipping; the collapsed unclipped T 0.3 runs stopped", "S2: P2 T 0.3 loss = ln 511, rank ≈ 1"]

  - layout: tables
    title: "Decisions so far (2/3)"
    tables:
      - widths: [1.5, 6.2, 4.6]
        header: ["date", "decision", "based on"]
        rows:
          - ["2026-10-21", "P0 recipe: T 0.1, λ 0.4 (confirmed)", "S2 probes: lowest CE, beats frozen random encoders"]
          - ["2026-10-21", "P1 recipe: T 0.1, λ 0.4 (confirmed); P0 and P1 pretrain for 30 epochs, 2 seeds", "S2 probes: lowest CE of the grid"]
          - ["2026-10-22", "P2 recipe: T 0.1, λ 0.4 (confirmed)", "S2 probes: lowest CE, beats frozen random encoders"]
          - ["2026-10-22", "30-epoch pretrainings stopped", "gradient blowups; P0 seed 42 collapsed"]
          - ["2026-10-22", "last.ckpt rewritten every epoch again (Lightning 2.6 kept it at the last val-loss improvement)", "stopped P0: last.ckpt was epoch 5 of 15"]
          - ["2026-10-22", "QK-norm in every arm's intersample attention; a 10-epoch pilot before the 30-epoch runs", "attention logits 10⁵–10⁷: one-hot attention"]
          - ["2026-10-22", "Memory-lean QK-norm; expandable CUDA allocator segments for every run", "P1 out of GPU memory (QK-norm +3 GiB; 2–4 GiB lost to fragmentation)"]
          - ["2026-10-23", "30-epoch P0, P1, P2 with QK-norm at lr 1e-3 (3-day walltime)", "QK-norm pilot: logits ≤ 45, no blowups, probes as before"]
          - ["2026-10-26", "P2 gets no downstream arm for now; S3: 3 learning rates per arm, a factor 2 apart", "P2 probe ≈ random, its jet-feature embedding collapses"]

  - layout: tables
    title: "Decisions so far (3/3)"
    tables:
      - widths: [1.5, 6.2, 4.6]
        header: ["date", "decision", "based on"]
        rows:
          - ["2026-10-26", "Batches that fill the card in every arm (SC/FT 28,672; + JC 14,336; FR 94,208; FR + JC 53,760)", "request: fill the GPU"]
          - ["2026-10-28", "Final lrs: SC 1.1e-3, SC + JC 8e-4, FT ← P0 1.1e-3, FT ← P1 + JC 8e-4 (pretrained parts lr / 10), FR ← P0 2e-3, FR ← P1 + JC 1.5e-3", "S3"]
          - ["2026-10-28", "Final runs on fresh seeds; a control for the CE gap to the earlier studies", "S3; question on the CE level"]
          - ["2026-11-03", "Rerun SC + JC with gradient clipping at 5.0", "3 of 4 final SC + JC runs collapsed"]
          - ["2026-11-04", "Stop SC + JC: reported as unstable", "clipping did not fix it (2 of 4 collapsed)"]
          - ["2026-11-04", "Wrap up; then a label-fraction scan (1–30% of the labels)", "the low-label evidence is one seed"]
          - ["2026-11-05", "Regularisation check at 3% (weight decay 0.05, dropout 0.1, both) before the label-fraction scan", "lr check: every method overfits in 3–8 epochs; the lr moves the CE ≤ 0.01"]
          - ["2026-11-05", "Label-fraction scan: 1, 3, 10, 30% of the labels, 3 seeds; lr from the 3% check (from scratch kept at 1.1e-3 at 10 and 30%); no extra regularisation", "regularisation moved the CE ≤ 0.003; from scratch at 2.2e-3 diverged in S3"]

  - layout: cards
    title: "Conclusions"
    cards:
      - {header: "Pretraining does not help here", text: "With 18.6M labelled jets, training from scratch beats fine-tuning a contrastively pretrained model (by 0.005–0.007 in val CE) and frozen pretrained encoders (0.020–0.026). The test rejections over 4 seeds agree."}
      - {header: "JC helps the pretrained methods", text: "A contrastive term on the global jet embedding improves them and removes most of their overfitting, but does not close the gap. From scratch + JC is unstable."}
      - {header: "The data sets the level", text: "The CE level (~0.62) is set by the amount of labelled data: the same model reaches 0.604 on a dataset with 2.8× more jets."}
      - {header: "Fewer labels", text: "At 10% and 3% of the labels pretraining did not help either. At 3% every method overfits within a few epochs, the pretrained ones fastest; weight decay and dropout leave the best CE unchanged (≤ 0.003), so the gap is not an overfitting artefact."}

  - layout: cards
    title: "Next"
    cards:
      - {header: "Label-fraction scan (running)", text: "From scratch, fine-tuned and frozen at 1, 3, 10 and 30% of the labels, 3 seeds each, the lr from the 3% check and no extra regularisation: does pretraining overtake training from scratch at some fraction?"}
      - {header: "Then: learning curve", text: "Best val CE against the number of labelled jets, one line per method, with the 100% point from the final runs."}
