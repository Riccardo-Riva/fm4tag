# Label-fraction scan (L_scan.cells): best validation CE against the number of labelled training jets, per training
# method (scripts/plot_method_scan.py):
#
#   sbatch slurm/plot_job.sh scripts/plot_method_scan.py:scripts/configs/method_scan_labels.yaml
#
# Runs: every completed run under `stages` (1, 3, 10 and 30% of the labels: the first N rows of the pre-shuffled
# train file, so the subsets are nested; 3 seeds each; the pretrained methods from the P0 seed-42 checkpoint) plus,
# as the 100% point, the final runs of the same three methods (`extra_runs`: 4 runs each, the pretrained ones from
# 2 P0 seeds x 2 training seeds, at the full-data recipe).  Each run is put in an arm by its own .hydra config;
# x = datamodule.train_max_rows (null = the whole train split, 18.6M jets).  Validation: the full 1.86M jets.

method_scan:
  out_dir: plots/label_scan/learning_curve
  filenames: {best_vs_x: best_val_ce_vs_labelled_jets.png, curves: ce_per_epoch.png}
  stages:
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/L_scan_20261105_151751
  extra_runs:
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235642/sc/seed_4242
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235642/sc/seed_42424
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235642/sc/seed_424242
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235642/sc/seed_4242424
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235640/ft_p0s42/seed_4242
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235640/ft_p0s42/seed_42424
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235640/ft_p0s424/seed_4242
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235640/ft_p0s424/seed_42424
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235640/fr_p0s42/seed_4242
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235640/fr_p0s42/seed_42424
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235640/fr_p0s424/seed_4242
    - /storage3/DSIP/rriva/research/fm4tag-chunk/slurm/ssl_campaign/F_final_20261028_235640/fr_p0s424/seed_42424
  x_key: datamodule.train_max_rows
  x_null: 18600000                   # no train_max_rows = the whole train split
  x_ref: 18600000                    # {r} = x / x_ref in the texts: the fraction of the labels
  x_scale: log
  ticks_at_x: true
  val_metric: val/head/loss_ce
  train_metric: train/head/loss_ce_epoch
  epoch_offset: 1                    # Lightning counts epochs from 0; 1 = the first epoch is epoch 1

  arms:
    sc: {encoder: scratch, pretraining: null, jet_contrastive: 0.0, colour: '#2a78d6'}
    ft_p0: {encoder: finetune, pretraining: p0, jet_contrastive: 0.0, colour: '#eb6834'}
    fr_p0: {encoder: frozen, pretraining: p0, jet_contrastive: 0.0, colour: '#1baf7a'}

  best_figsize: [6.5, 4.5]
  curves_figsize: [14.0, 4.4]
  # ylim_best: [0.6, 0.9]
  # ylim_curves: [0.4, 1.2]
  legend_loc: best
  ink: '#333333'
  best_marker: {marker: '*', size: 11, edge: '#222222', edge_width: 0.9}   # on each run's lowest validation CE; null = none
  # The legend of each panel sits below it, so it never covers a curve.
  curves_legend: {loc: upper center, anchor: [0.5, -0.2], ncol: 2, fontsize: 8}
  curves_zoom: {filename: ce_per_epoch_zoom.png, ylim: [0.58, 0.95]}   # the curves figure at this y range; null = none

  # ---- ALL the wording of the figures lives here --------------------------------------------------------------
  texts:
    arm: {sc: 'From scratch', ft_p0: 'Fine-tuned (P0)', fr_p0: 'Frozen encoders (P0)'}
    title_best: 'Best validation cross-entropy against the number of labelled jets'   # '' = no title
    xlabel: 'Labelled training jets (fraction of the 18.6M)'
    ylabel_best: 'Best validation cross-entropy'
    run: 'One run'
    title_curves: 'Cross-entropy per epoch, every run of the label-fraction scan'
    xlabel_curves: 'Epoch'
    ylabel_curves: 'Cross-entropy'
    x_tick: '{r:.0%}'                # tick per x value; {x} = labelled jets, {r} = their fraction
    x_value: '{r:.0%} of the labels ({x:,.0f} jets)'   # legend entry per x value
    val: 'Validation'
    train: 'Training (epoch mean)'
    best: 'Lowest validation CE of each run'   # legend of the stars
    title_curves_zoom: 'Cross-entropy per epoch, every run of the label-fraction scan (zoom)'
