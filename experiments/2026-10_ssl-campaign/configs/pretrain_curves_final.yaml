# The pretrainings the downstream methods start from, epoch by epoch (scripts/plot_pretrain_curves.py):
#
#   sbatch slurm/plot_job.sh scripts/plot_pretrain_curves.py:experiments/2026-10_ssl-campaign/configs/pretrain_curves_final.yaml
#
#   P0  contrastive on the feature embeddings: the track embeddings and the jet-feature embedding, weight 1 each
#   P1  P0 + JC, the contrastive term on the global jet embedding (the aggregator's output), weight 1
# P_full stages: 30 epochs on the 39.7M-jet pretraining split, batch 12,288 in chunks of 512 jets, lr 1e-3 (cosine),
# gradient clipping 1.0, QK-norm, T 0.1, augmentation λ 0.4; 2 seeds each.  The terms, their weights and the
# embedding sizes are read from each run's own .hydra config; the run keys only name the files.
#
# Three figures per run:
#   <key>_loss_terms.png                total loss and each term; training (epoch mean, dashed), validation (solid)
#   <key>_loss_and_effective_rank.png   total loss (left axis) + effective rank of each trained embedding (right)
#   <key>_loss_and_uniformity.png       total loss (left axis) + uniformity of each trained embedding (right)
# Embedding metrics: EmbeddingMetrics on clean (not augmented) embeddings of up to 8192 validation jets per epoch;
# there is no training-split value.

pretrain_curves:
  out_dir: experiments/2026-10_ssl-campaign/plots/pretrain_curves/final
  runs:                              # key -> run directory (the key only names the file and picks the title)
    p0_s42: /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/P_full_20261023_085735/p0/seed_42
    p0_s424: /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/P_full_20261023_085735/p0/seed_424
    p1_s42: /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/P_full_20261026_094445/p1/seed_42
    p1_s424: /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/P_full_20261026_094445/p1/seed_424

  figures:                           # kind -> its file ({key} = a key of `runs`) and any style override
    loss_terms:
      filename: '{key}_loss_terms.png'
      linestyles: {train: '--', val: '-'}
      marker: null
    effective_rank: {filename: '{key}_loss_and_effective_rank.png'}
    uniformity: {filename: '{key}_loss_and_uniformity.png'}

  loss_metrics: {train: train/loss_epoch, val: val/loss}
  term_metrics: {train: 'train/{embedding}/loss_contrastive_epoch', val: 'val/{embedding}/loss_contrastive'}
  embedding_metric: 'val/{embedding}/{metric}'
  sum_tolerance: 1.0e-3              # largest allowed |logged total - weighted sum of the terms|
  epoch_offset: 1                    # Lightning counts epochs from 0; 1 = the first epoch is epoch 1

  # Embeddings, as logged:
  #   tracks_embedding  projection of each track
  #   jets_embedding    projection of the global jet features
  #   aggregator        the global jet embedding; trained only with JC: P0 never trains the aggregator, so its
  #                     metrics there describe random weights and are not drawn (`trained_if`)
  embeddings: [tracks_embedding, jets_embedding, aggregator]
  trained_if: {aggregator: jet_contrastive}
  loss_weight: {tracks_embedding: contrastive, jets_embedding: contrastive, aggregator: jet_contrastive}
  embedding_dim:                     # config keys whose sum is each embedding's size ({dim} in the texts)
    tracks_embedding: [encoders.constituents.tracks.proj_out]
    jets_embedding: [encoders.global_encoder.proj_out]
    aggregator: [encoders.global_encoder.proj_out, encoders.constituents.tracks.proj_out]

  figsize: [8.0, 5.0]
  linewidth: 1.6
  marker: o                          # on every epoch point; null = lines only
  markersize: 4
  colors:
    train: '#1f77b4'
    val: '#ff7f0e'
    total: '#333333'
    tracks_embedding: '#2ca02c'
    jets_embedding: '#9467bd'
    aggregator: '#8c564b'
  linestyles: {train: '-', val: '-', right: '--'}
  ink: '#333333'
  # A star on the lowest validation loss (the total) and, at that epoch, on every other validation curve: the
  # terms, and the embedding metric (not necessarily at its own extreme there).  null = no stars.
  # size_metric: the stars on the right-axis (embedding) curves, larger than the loss star so that a loss star lying
  # on one of them leaves a ring of the metric's colour.
  best_marker: {marker: '*', size: 13, size_metric: 19, edge: white, edge_width: 0.6}
  # ylim_left: [5.4, 7.2]
  # ylim_right: [0, 260]
  legend: {loc: upper center, anchor: [0.5, -0.15], ncol: 3, fontsize: 9, frame: false}

  # ---- ALL the wording of the figures lives here --------------------------------------------------------------
  texts:
    run:                             # {run} in the titles
      p0_s42: 'P0, seed 42'
      p0_s424: 'P0, seed 424'
      p1_s42: 'P1 (P0 + JC), seed 42'
      p1_s424: 'P1 (P0 + JC), seed 424'
    xlabel: 'Epoch'
    loss_terms:
      title: '{run}: total loss and its terms'   # '' = no title
      best: 'Lowest validation total: {best:.3f} (epoch {epoch}); its terms at that epoch'   # {best}, {epoch}
      ylabel: 'Contrastive loss'
      total: 'Total = {formula}'     # {formula} = the weighted sum, written with formula_term and formula_join
      formula_term: '{w:g}·{symbol}' # {w} = the term's weight in this run, {symbol} = symbol below
      formula_join: ' + '
      symbol:
        tracks_embedding: '$L_\mathrm{track}$'
        jets_embedding: '$L_\mathrm{jet}$'
        aggregator: '$L_\mathrm{JC}$'
      term:
        tracks_embedding: 'Track embeddings ($L_\mathrm{track}$)'
        jets_embedding: 'Jet-feature embedding ($L_\mathrm{jet}$)'
        aggregator: 'Global jet embedding, JC ($L_\mathrm{JC}$)'
      train: 'Training (epoch mean)'
      val: 'Validation'
    effective_rank:
      title: '{run}: loss and effective rank of the embeddings'
      best: 'Lowest validation loss: {best:.3f} (epoch {epoch})'
      best_metric: 'Effective rank at that epoch'
      ylabel_left: 'Contrastive loss (total)'
      ylabel_right: 'Effective rank (validation)'
      train: 'Training loss (epoch mean)'
      val: 'Validation loss'
      embedding:                     # legend entries of the right-axis curves; {dim} = the embedding's size
        tracks_embedding: 'Effective rank: track embeddings (of {dim})'
        jets_embedding: 'Effective rank: jet-feature embedding (of {dim})'
        aggregator: 'Effective rank: global jet embedding (of {dim})'
    uniformity:
      title: '{run}: loss and uniformity of the embeddings'
      best: 'Lowest validation loss: {best:.3f} (epoch {epoch})'
      best_metric: 'Uniformity at that epoch'
      ylabel_left: 'Contrastive loss (total)'
      ylabel_right: 'Uniformity (validation; lower = more uniform)'
      train: 'Training loss (epoch mean)'
      val: 'Validation loss'
      embedding:
        tracks_embedding: 'Uniformity: track embeddings'
        jets_embedding: 'Uniformity: jet-feature embedding'
        aggregator: 'Uniformity: global jet embedding'
