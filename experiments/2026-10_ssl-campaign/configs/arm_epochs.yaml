# Cross-entropy and embedding quality epoch by epoch, for every final run of the compared training methods trained
# with the cross-entropy ALONE (scripts/plot_arm_epochs.py): from scratch, fine-tuned and frozen encoders from P0, and
# (F_p1_nojc, added 2026-11-11) fine-tuned and frozen encoders from P1:
#
#   MPLBACKEND=Agg .venv/bin/python scripts/plot_arm_epochs.py --config experiments/2026-10_ssl-campaign/configs/arm_epochs.yaml
#
# Runs: every completed run under `stages`, put in an arm by its own .hydra config (never its directory name):
#   encoder          scratch (no encoder_ckpt) | finetune (encoder_ckpt set, encoders trained) |
#                    frozen (encoder_ckpt set, finetune.freeze_encoders true: encoders and projectors frozen,
#                    aggregator and head trained)
#   pretraining      null for scratch; p0 / p1 / p2 = what the encoder_ckpt run optimised, read from that run's
#                    own config (P0: contrastive on the feature embeddings; P1: P0 + jet_contrastive)
#   jet_contrastive  finetune.loss_weights.jet_contrastive of the run (downstream JC weight)
# Runs in no listed arm (the JC arms: arm_epochs_p1.yaml) are skipped and counted on stdout.
#
# Embeddings (EmbeddingMetrics: clean embeddings of up to 8192 validation jets per epoch; no training value):
#   tracks_embedding  projector output of each valid track
#   jets_embedding    projector output of the jet-level features
#   aggregator        the global jet embedding, read by the classification head
# In the frozen arm the first two do not change (frozen encoders and projectors): flat lines.

arm_epochs:
  out_dir: experiments/2026-10_ssl-campaign/plots/arm_comparison/epochs
  stages:
    - /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/F_final_20261028_235640
    - /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/F_final_20261028_235642
    - /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/F_p1_nojc_20261109_175801
  runs_per_arm: 4
  epoch_offset: 1                    # Lightning counts epochs from 0; 1 = the first epoch is epoch 1

  arms:                              # drawing order = this order (the last one is drawn on top)
    sc: {encoder: scratch, pretraining: null, jet_contrastive: 0.0, colour: '#2a78d6'}
    ft_p0: {encoder: finetune, pretraining: p0, jet_contrastive: 0.0, colour: '#eb6834'}
    fr_p0: {encoder: frozen, pretraining: p0, jet_contrastive: 0.0, colour: '#1baf7a'}
    ft_p1: {encoder: finetune, pretraining: p1, jet_contrastive: 0.0, colour: '#9c2f0a'}
    fr_p1: {encoder: frozen, pretraining: p1, jet_contrastive: 0.0, colour: '#0b6b49'}

  ce:
    filename: ce_train_val.png
    train_metric: train/head/loss_ce_epoch   # epoch mean of the training CE
    val_metric: val/head/loss_ce              # also picks each run's best epoch (run_selection.csv)
    figsize: [8.0, 5.0]
    # ylim: [0.5, 0.75]                   # y range of `filename`; unset = automatic
    zoom_filename: ce_train_val_zoom.png    # a copy at y range `zoom_ylim`; null = none
    zoom_ylim: [0.48, 0.76]

  embedding_figures:                 # metric -> file; panels = `embeddings`, column val/<embedding>/<metric>
    effective_rank: effective_rank.png
    uniformity: uniformity.png
  embeddings: [tracks_embedding, jets_embedding, aggregator]
  embedding_figsize: [14.0, 4.2]

  linewidth: 1.3
  alpha: 0.85
  linestyles: {train: '--', val: '-'}
  ink: '#333333'                     # the black lines of the train/validation legend entries
  # A star on each run's lowest validation CE (its evaluated checkpoint) and, at that epoch, on each of its
  # embedding curves (not necessarily at their own extreme there).  null = no stars.
  best_marker: {marker: '*', size: 10, edge: white, edge_width: 0.5}

  # ---- ALL the wording of the figures lives here --------------------------------------------------------------
  texts:
    arm:                             # legend entry per arm
      sc: 'From scratch'
      ft_p0: 'Fine-tuned (P0)'
      fr_p0: 'Frozen encoders (P0)'
      ft_p1: 'Fine-tuned (P1)'
      fr_p1: 'Frozen encoders (P1)'
    xlabel: 'Epoch'
    best_epoch: 'At the epoch of the run''s lowest validation CE'   # legend of the stars, embedding figures
    ce:
      title: 'Training and validation cross-entropy, 4 runs per method'   # '' = no title
      ylabel: 'Cross-entropy'
      train: 'Training (epoch mean)'
      val: 'Validation'
      best: 'Lowest validation CE of each run'   # legend of the stars
      zoom_title: 'Training and validation cross-entropy, 4 runs per method (zoom)'   # title of the zoomed copy
    effective_rank:
      title: 'Effective rank of the embeddings (validation), 4 runs per method'
      ylabel: 'Effective rank'
    uniformity:
      title: 'Uniformity of the embeddings (validation, lower = more uniform), 4 runs per method'
      ylabel: 'Uniformity'
    panel:                           # one panel title per embedding
      tracks_embedding: 'Track embeddings'
      jets_embedding: 'Jet-feature embedding'
      aggregator: 'Global jet embedding'
