# Test-set rejections of the 24 dropout runs (D_drop: dropout 0.2 on every layer, 80 epochs) next to the no-dropout
# runs of the same cases and of the P1 CE-only controls (scripts/arm_test_metrics.py), same method as
# arm_test_metrics.yaml.  Arm keys without a suffix are the no-dropout runs (the same keys as arm_test_metrics.yaml),
# `_d` the dropout runs; the arms are told apart by their campaign cell (`cells`).  The inference cache is shared
# with arm_test_metrics.yaml (experiments/2026-11_dropout/plots/dropout/test_metrics/cache -> the absolute path of
# experiments/2026-10_ssl-campaign/plots/arm_comparison/test_metrics/cache), so only the 24 new runs need the GPU.
#
#   sbatch slurm/arm_test_metrics_job.sh /storage3/DSIP/rriva/research/fm4tag/experiments/2026-11_dropout/configs/dropout_test_metrics.yaml

arm_test_metrics:
  out_dir: /storage3/DSIP/rriva/research/fm4tag/experiments/2026-11_dropout/plots/dropout/test_metrics
  stages:
    - /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/F_final_20261028_235640
    - /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/F_final_20261028_235642
    - /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/F_p1_nojc_20261109_175801
    - /storage3/DSIP/rriva/research/fm4tag/experiments/2026-10_ssl-campaign/outputs/F_scjc_stab_20261109_175800
    - /storage3/DSIP/rriva/research/fm4tag/experiments/2026-11_dropout/outputs/D_drop_20261113_215456
    - /storage3/DSIP/rriva/research/fm4tag/experiments/2026-11_dropout/outputs/D_drop_20261113_215501
  runs_per_arm: 4
  epoch_offset: 1
  ce: {val_metric: val/head/loss_ce}       # picks each run's best epoch (and its checkpoint)
  arms:
    # no dropout (F_final, F_p1_nojc, F_scjc_stab)
    sc: {encoder: scratch, pretraining: null, jet_contrastive: 0.0, cells: [sc]}
    ft_p0: {encoder: finetune, pretraining: p0, jet_contrastive: 0.0, cells: [ft_p0s42, ft_p0s424]}
    fr_p0: {encoder: frozen, pretraining: p0, jet_contrastive: 0.0, cells: [fr_p0s42, fr_p0s424]}
    ft_p1: {encoder: finetune, pretraining: p1, jet_contrastive: 0.0, cells: [ft_p1s42, ft_p1s424]}
    fr_p1: {encoder: frozen, pretraining: p1, jet_contrastive: 0.0, cells: [fr_p1s42, fr_p1s424]}
    scjc: {encoder: scratch, pretraining: null, jet_contrastive: 0.3, cells: [scjc_clip1]}
    ftjc_p1: {encoder: finetune, pretraining: p1, jet_contrastive: 0.3, cells: [ftjc_p1s42, ftjc_p1s424]}
    frjc_p1: {encoder: frozen, pretraining: p1, jet_contrastive: 0.3, cells: [frjc_p1s42, frjc_p1s424]}
    # dropout 0.2 everywhere, 80 epochs (D_drop)
    sc_d: {encoder: scratch, pretraining: null, jet_contrastive: 0.0, cells: [sc_d02]}
    ft_p0_d: {encoder: finetune, pretraining: p0, jet_contrastive: 0.0, cells: [ft_p0s42_d02, ft_p0s424_d02]}
    fr_p0_d: {encoder: frozen, pretraining: p0, jet_contrastive: 0.0, cells: [fr_p0s42_d02, fr_p0s424_d02]}
    scjc_d: {encoder: scratch, pretraining: null, jet_contrastive: 0.3, cells: [scjc_clip1_d02]}
    ftjc_p1_d: {encoder: finetune, pretraining: p1, jet_contrastive: 0.3, cells: [ftjc_p1s42_d02, ftjc_p1s424_d02]}
    frjc_p1_d: {encoder: frozen, pretraining: p1, jet_contrastive: 0.3, cells: [frjc_p1s42_d02, frjc_p1s424_d02]}

  val_file: /storage3/DSIP/rriva/datasets/transforming-jet-flavor/data_parallel_preprocess_251112_152051/val/output/pp_output_val.h5
  test_file: /storage3/DSIP/rriva/datasets/transforming-jet-flavor/data_parallel_preprocess_251112_152051/test/output/pp_output_test.h5
  cuts:                                    # pt in MeV, as in roc_comparison_arms_final.yaml
    - [pt, '>', 20000]
    - [pt, '<', 250000]
    - [eta, '>', -2.5]
    - [eta, '<', 2.5]

  # Reference tagger: its scores are columns of both files; its rejections on val set the search floors.
  reference:
    label: GN2v01
    probs: {b: GN2v01_pb, c: GN2v01_pc, u: GN2v01_pu, tau: GN2v01_ptau}
    fractions: {c: 0.2, tau: 0.01}

  nominal_fractions: {c: 0.2, tau: 0.01}
  working_points: [0.70, 0.77, 0.80, 0.85]

  # Per-run (f_c, f_tau) on val: max c-rejection at working_point with light and tau rejection >= floor_frac x the
  # reference's (the standing ROC convention); grid f_c in [0, fc_max) x f_tau in [0, ftau_max) at `step`.
  # The 6 best-seed models had their optima at f_c <= 0.05 and f_tau <= 0.07; an optimum on the box edge is flagged
  # in per_run.csv (grid_edge).
  search: {working_point: 0.8, floor_frac: 1.0, step: 0.002, fc_max: 0.15, ftau_max: 0.12}

  # bf16 autocast as in training; batch a multiple of chunk_size 512.
  inference: {batch_size: 28672, num_workers: 8, precision: bf16}
